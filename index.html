<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sieg 業務ポータル</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" content="Siegの業務ツール入口。日報・シフト入力・交通費計算・経費精算・掲示板・資料・緊急連絡先。">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sieg">
<style>
/* ═════ 配色・角丸などの基本値 ═════ */
:root{
  --bg:#EFF1F4; --surface:#FFF; --sunk:#F4F6F8;
  --ink:#0E1A2C; --ink2:#3E4A5B; --mute:#79828F; --faint:#A6AEBA;
  --hair:#E3E6EA; --hair2:#ECEEF1;
  --amber:#A06400; --amber-tint:#FAF0DF;
  --red:#AE2B24;   --red-tint:#F9EAE8;
  --blue:#294780;  --blue-tint:#E9EEF6;
  --teal:#16645C;  --teal-tint:#E4F0EE;
  --green:#1B6541; --green-tint:#E6F0EA;
  --slate:#465162; --slate-tint:#ECEEF1;
  --lift:0 1px 1px rgba(14,26,44,.035), 0 5px 16px rgba(14,26,44,.05);
  --r:18px;
  --inset:69px; /* アイコン幅ぶん、区切り線を内側から始める */
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0C1015; --surface:#161B23; --sunk:#1C222B;
    --ink:#E9EEF4; --ink2:#B7C1CD; --mute:#818B9A; --faint:#5A6473;
    --hair:#232A34; --hair2:#1E242C;
    --amber:#E7AB44; --amber-tint:#2A2115;
    --red:#F07B6F;   --red-tint:#2B1917;
    --blue:#84A9E3;  --blue-tint:#182130;
    --teal:#5FC6B9;  --teal-tint:#142625;
    --green:#5FC48C; --green-tint:#152621;
    --slate:#98A3B2; --slate-tint:#1C222B;
    --lift:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-feature-settings:"palt"; line-height:1.5; letter-spacing:.012em;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100svh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.pad{padding:0 15px}

/* ═════ ヘッダー ═════ */
.bar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--surface) 84%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;
  padding:calc(11px + env(safe-area-inset-top)) 15px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  transition:border-color .2s;
}
.bar.stuck{border-bottom-color:var(--hair)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mk{width:28px;height:28px;flex:none;border-radius:8px;overflow:hidden;
  background:#fff;box-shadow:0 0 0 1px var(--hair)}
.brand .mk img{width:100%;height:100%;display:block;object-fit:cover}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.who{
  display:flex;align-items:center;gap:8px;flex:none;
  background:var(--sunk);border-radius:999px;padding:5px 13px 5px 5px;
  font-size:13px;font-weight:700;transition:transform .12s;
}
.who:active{transform:scale(.95)}
.who i{width:27px;height:27px;border-radius:50%;background:var(--ink);color:var(--surface);
  display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none}
.who.unset{color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.who.unset i{background:var(--amber);color:#fff}

/* ═════ 画面切り替え ═════ */
.view{display:none;padding-top:18px}
.view.on{display:block}
.view.on.enter > *{animation:rise .36s cubic-bezier(.22,.68,.28,1) backwards}
.view.on.enter > *:nth-child(2){animation-delay:.055s}
.view.on.enter > *:nth-child(3){animation-delay:.1s}
.view.on.enter > *:nth-child(4){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.head{padding:2px 5px 16px}
.head .d{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.head h2{font-size:21px;font-weight:800;margin-top:5px;line-height:1.42;text-wrap:pretty}
/* あいさつ：時間帯で色が変わるカード（朝・昼・夜は data-tod） */
#v-home .head{margin:0 0 16px;padding:18px 74px 20px 18px;border-radius:22px;background:var(--hero);box-shadow:var(--lift)}
#v-home .head .d{color:var(--hero-sub)}
#v-home .head h2{color:var(--hero-ink);font-size:21px;font-weight:900;letter-spacing:.01em;word-break:keep-all;overflow-wrap:anywhere}
#v-home .head .sub{display:block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--hero-sub)}
:root[data-tod="morning"]{--hero:linear-gradient(135deg,#FFE7BF 0%,#FFF4E0 55%,#FFFFFF 100%);--hero-ink:#5A3A00;--hero-sub:#9A6A1A}
:root[data-tod="day"]{--hero:linear-gradient(135deg,#DDEBFF 0%,#F2F7FF 60%,#FFFFFF 100%);--hero-ink:#13305E;--hero-sub:#4F6A93}
:root[data-tod="night"]{--hero:linear-gradient(135deg,#1C2B4D 0%,#14203A 60%,#101826 100%);--hero-ink:#F3F6FB;--hero-sub:#A9B8D3}
@media (prefers-color-scheme:dark){
  :root[data-tod="morning"]{--hero:linear-gradient(135deg,#3A2A12 0%,#251C10 70%);--hero-ink:#FFE3B0;--hero-sub:#C9A36A}
  :root[data-tod="day"]{--hero:linear-gradient(135deg,#17284A 0%,#121C30 70%);--hero-ink:#E6EEFB;--hero-sub:#93A7C8}
}
/* 見出しは丸みのある書体（読めないときは端末の書体） */
.brand b,#v-home .head h2,#homeTools .tx b{font-family:"Zen Maru Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}

/* ホームのツール：2列のタイル。数が奇数なら最後は横長 */
#homeTools{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:none;box-shadow:none;overflow:visible}
#homeTools .row{flex-direction:column;align-items:flex-start;gap:10px;min-height:128px;padding:15px 15px 13px;
  border-radius:20px;background:var(--surface);box-shadow:var(--lift);border:1px solid var(--hair2);
  transition:transform .14s cubic-bezier(.3,.7,.4,1);animation:tile-in .42s cubic-bezier(.22,.68,.28,1) backwards}
#homeTools .row::before{display:none}
#homeTools .row:active{transform:scale(.96)}
#homeTools .row:nth-child(2){animation-delay:.05s}
#homeTools .row:nth-child(3){animation-delay:.1s}
#homeTools .row:nth-child(4){animation-delay:.15s}
#homeTools .row:nth-child(5){animation-delay:.2s}
#homeTools .row:nth-child(6){animation-delay:.25s}
#homeTools .row:last-child:nth-child(odd){grid-column:span 2;flex-direction:row;align-items:center;min-height:0}
#homeTools .ic{width:42px;height:42px;border-radius:14px}
#homeTools .tx{flex:none}
#homeTools .tx b{font-size:16.5px;font-weight:900}
#homeTools .tx small{display:none}
#homeTools .st{margin-top:auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;
  padding:4px 9px;border-radius:999px;background:var(--amber-tint);color:var(--amber)}
#homeTools .st.ok{background:var(--green-tint);color:var(--green)}
#homeTools .st i{width:6px;height:6px;border-radius:50%;background:currentColor}
#homeTools .row:last-child:nth-child(odd) .st{margin:0 0 0 auto}
@keyframes tile-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

h3.sec{font-size:11.5px;font-weight:800;color:var(--mute);padding:0 7px 8px;letter-spacing:.07em}
.view > h3.sec{margin-top:26px}

/* ═════ 通信状態 ═════ */
.off{display:none;align-items:center;gap:9px;background:var(--amber-tint);color:var(--amber);
  border-radius:13px;padding:11px 14px;margin-bottom:14px;font-size:12.5px;font-weight:700}
.off.show{display:flex}
.off span{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}

/* ═════ お知らせ（掲示板） ═════ */
.notice{background:var(--surface);border-radius:var(--r);box-shadow:var(--lift);
  overflow:hidden;margin-bottom:24px;position:relative}
.notice::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);z-index:1}
.nt{position:relative}
.nt+.nt::before{content:"";position:absolute;left:19px;right:0;top:0;height:1px;background:var(--hair2)}
.nt>button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:14px 17px 14px 19px;min-height:60px}
.nt>button:active{background:var(--sunk)}
.nt .u{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.nt .ntx{flex:1;min-width:0}
.nt .ntx b{display:block;font-size:14.5px;font-weight:800;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt .ntx small{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt.read .ntx b{font-weight:700;color:var(--ink2)}
.nt .tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;flex:none;
  background:var(--slate-tint);color:var(--slate)}
.nt .tag.imp{background:var(--red-tint);color:var(--red)}
.nt .tag.meet{background:var(--blue-tint);color:var(--blue)}
.nt .car{flex:none;width:11px;height:11px;border-right:1.8px solid var(--faint);
  border-bottom:1.8px solid var(--faint);transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .24s cubic-bezier(.22,.68,.28,1)}
.nt[open] .car{transform:rotate(-135deg) translate(-3px,-3px)}
.nt .wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.22,.68,.28,1)}
.nt[open] .wrap{grid-template-rows:1fr}
.nt .wrap>div{overflow:hidden}
.nt .body{padding:0 17px 17px 19px}
.nt .body p{font-size:13.5px;line-height:1.85;color:var(--ink2);text-wrap:pretty;white-space:pre-wrap}
.nt .body .by{font-size:11.5px;color:var(--faint);margin-top:9px}
.more{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:14px 17px 14px 19px;border-top:1px solid var(--hair2);
  font-size:13px;font-weight:700;color:var(--ink2);background:var(--sunk)}
.more:active{opacity:.55}
.more em{color:var(--faint);font-size:12px;font-weight:600;font-style:normal}
.more.go{color:var(--amber)}

/* ═════ 一覧の行 ═════ */
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--lift);
  overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:14px;padding:15px 17px;min-height:70px;
  transition:background .12s,transform .1s;position:relative}
.row+.row::before{content:"";position:absolute;left:var(--inset);right:0;top:0;
  height:1px;background:var(--hair2)}
.row:active{background:var(--sunk);transform:scale(.994)}
.ic{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center}
.ic svg{width:21px;height:21px;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic.amber{background:var(--amber-tint)} .ic.amber svg{stroke:var(--amber)}
.ic.blue {background:var(--blue-tint)}  .ic.blue  svg{stroke:var(--blue)}
.ic.teal {background:var(--teal-tint)}  .ic.teal  svg{stroke:var(--teal)}
.ic.green{background:var(--green-tint)} .ic.green svg{stroke:var(--green)}
.ic.slate{background:var(--slate-tint)} .ic.slate svg{stroke:var(--slate)}
.ic.red  {background:var(--red-tint)}   .ic.red   svg{stroke:var(--red)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:16px;font-weight:800;letter-spacing:.02em}
.tx small{display:block;font-size:12px;color:var(--mute);margin-top:3px;line-height:1.5}
.tx small.tel{font-size:13.5px;color:var(--ink2);font-weight:600;
  letter-spacing:.07em;font-variant-numeric:tabular-nums;margin-top:2px}
.pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;flex:none;
  background:var(--red-tint);color:var(--red);white-space:nowrap}

.empty{padding:34px 18px;text-align:center;color:var(--mute);font-size:13px;line-height:1.9}
.hint{font-size:12px;color:var(--mute);line-height:1.85;text-align:center;padding:22px 14px 4px}
.hint b{color:var(--ink2);font-weight:700}
.foot{text-align:center;font-size:10px;color:var(--faint);letter-spacing:.26em;
  padding:18px 0 10px;opacity:.6}

/* ホーム画面に追加（Android / PC Chrome だけ出る） */
.install{display:none;width:100%;align-items:center;gap:13px;background:var(--surface);
  border-radius:var(--r);box-shadow:var(--lift);padding:15px 17px;margin-bottom:12px;text-align:left}
.install.show{display:flex}
.install i{width:40px;height:40px;border-radius:13px;background:var(--amber-tint);color:var(--amber);
  display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:800;flex:none}

/* ═════ 下のタブ ═════ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:440px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--hair);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:9px 0 calc(10px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10px;font-weight:800;color:var(--faint);position:relative;padding:2px 0;
  letter-spacing:.05em;transition:color .18s}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .18s,transform .18s}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true] svg{stroke-width:2.35;transform:translateY(-1px)}
.tab .n{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--amber);color:#fff;
  font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:999px;
  display:grid;place-items:center;padding:0 4px}

/* ═════ 下から出るシート ═════ */
/* 画面いっぱいの覆い。高さはJSで実寸を入れるので、
   アドレスバーの出入りやアプリ内ブラウザでもズレない。 */
.scrim{position:fixed;left:0;top:0;width:100%;height:100%;z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,13,21,.4);
  opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:440px;
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:8px 0 calc(16px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.scrim.on .sheet{transform:none}
.grip{width:36px;height:4px;border-radius:2px;background:var(--hair);margin:6px auto 15px}
.sheet{position:relative}
.sheet .x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;
  background:var(--sunk);color:var(--mute);font-size:13px;display:grid;place-items:center}
.sheet .x:active{opacity:.55}
.sheet h4{font-size:16.5px;font-weight:800;padding:0 52px 5px 20px}
.sheet .lead{font-size:12.5px;color:var(--mute);padding:0 20px 15px;line-height:1.7}
.pick{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px 20px;font-size:16px;font-weight:700;position:relative}
.pick+.pick::before,.pick.clear::before,.pick.cancel::before{content:"";position:absolute;
  left:20px;right:0;top:0;height:1px;background:var(--hair2)}
.pick:active{background:var(--sunk)}
.pick i{width:31px;height:31px;border-radius:50%;background:var(--sunk);display:grid;
  place-items:center;font-style:normal;font-size:13px;font-weight:800;color:var(--ink2);flex:none}
.pick .pt{flex:1;min-width:0}
.pick .pt small{display:block;font-size:11.5px;color:var(--mute);font-weight:600;margin-top:2px}
.pick[aria-current=true]{color:var(--amber)}
.pick[aria-current=true] i{background:var(--amber);color:#fff}
.pick.clear{color:var(--mute);font-weight:400;font-size:13.5px;margin-top:6px}
.pick.cancel{color:var(--ink2);font-weight:700;font-size:14.5px;justify-content:center}
.pick-head{padding:14px 20px 4px;font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em}
.pick-head+.pick::before{display:none}
</style>
</head>
<body>
<div class="app">

  <div class="bar" id="bar">
    <div class="brand">
      <span class="mk"><img src="icons/icon-192.png" alt="" width="28" height="28"></span>
      <b>Sieg.</b>
    </div>
    <button class="who unset" id="whoBtn" type="button"><i id="whoIni">?</i><span id="whoName">名前を選ぶ</span></button>
  </div>

  <!-- ══ ホーム ══ -->
  <section class="view on enter pad" id="v-home">
    <div class="off" id="offline"><span></span>オフラインです。お知らせは最新でない場合があります</div>
    <div class="notice" id="homeNotice" hidden></div>
    <div class="head">
      <div class="d" id="today"></div>
      <h2 id="greet">おつかれさまです</h2>
      <span class="sub" id="greetSub"></span>
    </div>
    <div class="list" id="homeTools"></div>
    <button class="install" id="install" type="button">
      <i>＋</i>
      <span class="tx"><b>ホーム画面に追加</b><small>アプリのように1タップで開けます</small></span>
    </button>
    <p class="hint"><b>ホーム画面に追加すると1タップで開けます</b><br>
    共有ボタン →「ホーム画面に追加」。開けないときはリンクを長押しして「他のブラウザで開く」を選んでください。</p>
    <div class="foot">SIEG ／ KUMAMOTO</div>
  </section>

  <!-- ══ ツール ══ -->
  <section class="view pad" id="v-tool">
    <div class="head"><h2>ツール</h2></div>
    <h3 class="sec" style="margin-top:0">申請する</h3>
    <div class="list" id="toolsA"></div>
    <h3 class="sec">見る・共有する</h3>
    <div class="list" id="toolsB"></div>
  </section>

  <!-- ══ お知らせ（掲示板） ══ -->
  <section class="view pad" id="v-info">
    <div class="head"><h2>お知らせ</h2></div>
    <div class="notice" id="allNotice"></div>
  </section>

  <!-- ══ 連絡先 ══ -->
  <section class="view pad" id="v-call">
    <div class="head"><div class="d">24時間つながります</div><h2>緊急連絡先</h2></div>
    <div class="list" id="contacts"></div>
    <p class="hint">つながらないときは Discord の #連絡 に書き込んでください。</p>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-v="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
    <button class="tab" role="tab" aria-selected="false" data-v="tool">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/></svg>ツール</button>
    <button class="tab" role="tab" aria-selected="false" data-v="info"><span class="n" id="badge" hidden>0</span>
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.5 21h3"/></svg>お知らせ</button>
    <button class="tab" role="tab" aria-selected="false" data-v="call">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg>連絡先</button>

</div>

<div class="scrim" id="scrim">
  <div class="sheet" id="sheet" role="dialog" aria-label="選択">
    <div class="grip"></div>
    <button class="x" id="sheetX" type="button" aria-label="閉じる">✕</button>

    <button class="pick clear" id="sheetClear" type="button" hidden>名前を消して「未設定」に戻す</button>

<script src="gas-client.js"></script>
<script src="sieg-roster.js"></script>
<script>
/* ══════════ ここだけ書き換えれば運用できます ══════════ */

/* お知らせ（掲示板）のGASデプロイURL */
var NOTICE_API  = 'https://script.google.com/macros/s/AKfycbxA1xDkeYuLRSo39iZju6-RUirpwAQbou_WjYe2G0t7KAQJAEADPgl8-56FW9jWzSvT/exec';
/* 掲示板への投稿ページ */
var NOTICE_POST = 'https://sakusakusansan-star.github.io/notice-form/';

/* 名簿は sieg-roster.js（ポータルと全ツールで共通）。人の増減はそちらだけ直す */
var R = window.SiegRoster || { staff: [], partners: [], everyone: [], forTool: function(){ return []; } };
var STAFF    = R.staff;      // Sieg社員
var PARTNERS = R.partners;   // パートナー様
var EVERYONE = R.everyone;

/* ツール
   for     … このツールを使う人（ホームやツール一覧には、選んだ人が使うものだけ出す）
   url     … 開く先。partnerUrl があればパートナー様はそちら
   withName… 開くときに ?staff=名前 を付ける */
var TOOLS = [
  { id:'nippou', name:'日報', desc:'実績・所感をDiscordへ送信', ic:'doc', c:'amber', home:true,
    for:R.forTool('nippou'), withName:true, url:'https://sakusakusansan-star.github.io/nippou-form/' },

  { id:'gain', name:'獲得報告', desc:'獲得した件数をDiscordへ送信', ic:'flag', c:'red', home:true,
    for:R.forTool('gain'), withName:true, url:'gain.html' },

  { id:'power', name:'戦闘力', desc:'今月の戦闘力とランキング', ic:'bolt', c:'slate', home:true,
    for:R.forTool('power'), withName:true, url:'power.html' },

  { id:'shift', name:'シフト入力', desc:'スマホから稼働日を送信', ic:'cal', c:'blue', home:true,
    for:EVERYONE, withName:true, url:'shift.html',
    partnerUrl:'https://sakusakusansan-star.github.io/shift-form/' },

  { id:'commute', name:'交通費計算', desc:'通勤距離・交通費の自動計算', ic:'car', c:'teal', home:true,
    for:R.forTool('commute'), withName:true, url:'https://sakusakusansan-star.github.io/commute-form/' },

  { id:'keihi', name:'経費精算', desc:'領収書をAIで自動読み取り', ic:'rcpt', c:'green', home:true,
    for:R.forTool('keihi'), withName:true, url:'https://sakusakusansan-star.github.io/keihi23/' },

  { id:'sheet', name:'シフト表を見る', desc:'みんなのシフト（スプレッドシート）', ic:'grid', c:'blue', group:'B',
    for:EVERYONE, url:'https://docs.google.com/spreadsheets/d/1wRBlTC_U2Mek5xj1YDFUEuAdRRlcVGZGIy_3WmmJLsQ/edit?usp=sharing' },

  { id:'docs', name:'資料置き場', desc:'予約番号の発行方法・料金表など', ic:'fold', c:'slate', group:'B',
    for:EVERYONE, url:'docs/' },

  { id:'post', name:'掲示板に投稿', desc:'お知らせ・会議予定を全員へ共有', ic:'board', c:'amber', group:'B',
    for:R.forTool('notice'), url:NOTICE_POST }
];

var CONTACTS = [
  { name:'代表　福岡', tel:'080-1787-9619', lead:true },
  { name:'清田',       tel:'090-7294-2546' },
  { name:'福山',       tel:'080-1751-3219' },
  { name:'古川',       tel:'070-8974-2868' }
];

/* ══════════ ここから下は触らなくて大丈夫です ══════════ */

var ICONS = {
  doc  :'<path d="M4 4h13l3 3v13H4z"/><path d="M8 10h8M8 14h6"/>',
  cal  :'<rect x="3" y="5" width="18" height="16" rx="2.2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  car  :'<rect x="5" y="3" width="14" height="14" rx="2.2"/><path d="M5 11h14M8 21l-1.6-4M16 21l1.6-4"/>',
  rcpt :'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  fold :'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  board:'<path d="M4 10v4h3l6 4V6l-6 4H4z"/><path d="M17.5 9.2a4 4 0 0 1 0 5.6"/>',
  grid :'<rect x="3" y="4" width="18" height="16" rx="2.2"/><path d="M3 9.5h18M3 15h18M9.5 4v16"/>',
  flag :'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
  bolt :'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  tel  :'<path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1z"/>'
};
function $(s){ return document.querySelector(s); }
function svg(k){ return '<svg viewBox="0 0 24 24">' + ICONS[k] + '</svg>'; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
function initial(s){ return Array.from(String(s))[0] || '?'; }

/* ═══ 日付 ═══ */
var W = ['日','月','火','水','木','金','土'];
(function(){
  var n = new Date();
  $('#today').textContent = n.getFullYear() + '年' + (n.getMonth() + 1) + '月' + n.getDate() + '日（' + W[n.getDay()] + '）';
})();

/* ═══ 端末に覚えておくこと（名前） ═══ */
var STAFF_KEY = 'siegStaff';
var PARTNER_KEY = 'siegPartnerName';   // パートナー様用シフト入力（shift-form）と共通
var READ_KEY = 'sieg.read';

function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e) {} }

function getStaff(){ var n = lsGet(STAFF_KEY); return EVERYONE.indexOf(n) >= 0 ? n : ''; }
function isPartner(n){ return PARTNERS.indexOf(n) >= 0; }
function setStaff(name){
  lsSet(STAFF_KEY, name);
  if (isPartner(name)) lsSet(PARTNER_KEY, name);
  paintWho();
  paintTools();
}
function clearStaff(){ lsDel(STAFF_KEY); paintWho(); paintTools(); }

/* 前の版からの引き継ぎ
   ・経費精算だけ個別に保存していた名前
   ・パートナー様がシフト入力で選んだ名前（前の版ではポータルの名前に入れていなかった）
   ・ツールごとに覚えていた行き先（siegChoice_…）は使わなくなったので消す */
(function(){
  if (!getStaff()) {
    var old = lsGet('siegStaff_keihi') || lsGet(PARTNER_KEY);
    if (EVERYONE.indexOf(old) >= 0) lsSet(STAFF_KEY, old);
  }
  lsDel('siegStaff_keihi');
  try {
    Object.keys(localStorage).forEach(function(k){ if (k.indexOf('siegChoice_') === 0) lsDel(k); });
  } catch(e) {}
})();

/* ═══ ツールの行 ═══ */
function toolRow(t, showFlag){
  return '<a class="row" href="' + esc(t.url || '#') + '" data-tool="' + esc(t.id) + '">'
    + '<span class="ic ' + t.c + '">' + svg(t.ic) + '</span>'
    + '<span class="tx"><b>' + esc(t.name) + '</b><small>' + esc(t.desc) + '</small></span>'
    + (showFlag && t.flag ? '<span class="pill">' + esc(t.flag) + '</span>' : '')
    + (showFlag && t.id === 'nippou' ? nippouState() : '')
    + '</a>';
}

/* 日報の「提出済み／未提出」（ホームのタイルだけに出す）。
   日報を送ると、日報の画面がこの端末に送った日付を残す（siegNippouSubmitted）。
   ほかのスマホから送った分はわからないので、そのときは未提出のまま出る。 */
function todayYmd(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function nippouState(){
  var me = getStaff();
  if (!me) return '';
  var sent = false;
  try { sent = (JSON.parse(lsGet('siegNippouSubmitted') || '{}')[me] || []).indexOf(todayYmd()) >= 0; } catch(e) {}
  return sent ? '<span class="st ok"><i></i>提出済み</span>' : '<span class="st"><i></i>未提出</span>';
}
function usable(t, me){ return !me || !t.for || t.for.indexOf(me) >= 0; }
function paintTools(){
  var me = getStaff();
  var mine = TOOLS.filter(function(t){ return usable(t, me); });
  $('#homeTools').innerHTML = mine.filter(function(t){ return t.home; })
    .map(function(t){ return toolRow(t, true); }).join('');
  $('#toolsA').innerHTML = mine.filter(function(t){ return t.group !== 'B'; })
    .map(function(t){ return toolRow(t, false); }).join('');
  $('#toolsB').innerHTML = mine.filter(function(t){ return t.group === 'B'; })
    .map(function(t){ return toolRow(t, false); }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'), function(a){
    var t = findTool(a.getAttribute('data-tool'));
    if (!t || !t.withName) return; // 名前の要らないツールはそのまま開く
    a.addEventListener('click', function(e){ e.preventDefault(); openTool(t); });
  });
}
function findTool(id){
  for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === id) return TOOLS[i];
  return null;
}

/* ═══ ツールを開く ═══
   選んだ人で開く（?staff=名前）。名前を選んでいなければ、先に名前の一覧を出す。 */
function openTool(t){
  var me = getStaff();
  if (!me) return pickPerson(function(){ openTool(t); });
  if (!usable(t, me)) return;
  var url = (isPartner(me) && t.partnerUrl) || t.url;
  location.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'staff=' + encodeURIComponent(me) + '&v=' + Date.now();
}

/* 名前の一覧（Sieg社員／パートナー様）。選ぶとこの端末に保存し、then があれば続けて呼ぶ */
function pickPerson(then){
  var me = getStaff();
  function people(list){ return list.map(function(n){ return { label:n, current:n === me, person:true }; }); }
  sheetOpen({
    title: 'あなたの名前を選んでください',
    lead: 'この端末に保存され、次からは各ツールがあなたの名前で開きます。<br>変えたいときは右上の名前から選び直せます。',
    items: [{ header:'Sieg社員' }].concat(people(STAFF), [{ header:'パートナー様' }], people(PARTNERS)),
    allowClear: !!me,
    onPick: function(it){
      setStaff(it.label);
      sheet(false);
      if (then) then();
    }
  });
}

/* ═══ 連絡先 ═══ */
$('#contacts').innerHTML = CONTACTS.map(function(c){
  return '<a class="row" href="tel:' + c.tel.replace(/-/g, '') + '">'
    + '<span class="ic ' + (c.lead ? 'red' : 'slate') + '">' + svg('tel') + '</span>'
    + '<span class="tx"><b>' + esc(c.name) + '</b><small class="tel">' + esc(c.tel) + '</small></span>'
    + (c.lead ? '<span class="pill">発信</span>' : '')
    + '</a>';
}).join('');

/* ═══ お知らせ（掲示板） ═══ */
var NOTICES = [];
var HOME_MAX = 3;
var noticeError = '';   // 読み込みに失敗したとき「お知らせはありません」と誤解させないため

function readSet(){
  try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); }
  catch(e) { return new Set(); }
}
function markRead(id){
  var r = readSet(); r.add(id);
  lsSet(READ_KEY, JSON.stringify(Array.from(r)));
}
/* 本文から短く安定した鍵をつくる（既読の記録用。記号や改行が入っても壊れない） */
function keyOf(str){
  var h = 5381;
  for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return 'n' + h.toString(36);
}
/* GASの1件を、この画面で使う形にそろえる */
function normalize(it, i){
  /* 1行目は見出しに使うので、2行目以降を本文にする（見出しの重複を避ける） */
  var lines = String(it.text || '').split('\n');
  var title = lines[0] || 'お知らせ';
  var rest = lines.slice(1).join('\n').replace(/^\s+/, '');

  var when = it.when ? (it.when + (it.youbi ? '（' + it.youbi + '）' : '')) : '';
  var meta = [];
  if (when) meta.push(when);
  if (it.time) meta.push(it.time);
  if (!when && it.date) meta.push(it.date);
  return {
    id: keyOf(String(it.id || '') + '|' + (it.date || '') + '|' + (it.when || '') + '|' + (it.text || '')),
    type: it.type || 'お知らせ',
    title: title,
    body: rest || it.text || '',
    meta: meta.join('　'),
    date: it.when || it.date || '',
    by: it.name || ''
  };
}
function tagClass(type){
  return type === '重要' ? ' imp' : type === '会議' ? ' meet' : '';
}
function noticeRow(n, unread){
  return '<div class="nt' + (unread ? '' : ' read') + '" data-id="' + esc(n.id) + '">'
    + '<button type="button" aria-expanded="false">'
    + (unread ? '<span class="u"></span>' : '')
    + (n.type === '重要' || n.type === '会議'
        ? '<span class="tag' + tagClass(n.type) + '">' + esc(n.type) + '</span>' : '')
    + '<span class="ntx"><b>' + esc(n.title) + '</b>'
    + (n.meta ? '<small>' + esc(n.meta) + '</small>' : '')
    + '</span><span class="car"></span></button>'
    + '<div class="wrap"><div><div class="body"><p>' + esc(n.body) + '</p>'
    + (n.by ? '<div class="by">投稿：' + esc(n.by) + '</div>' : '')
    + '</div></div></div></div>';
}
function paintNotices(){
  var r = readSet();
  var unread = NOTICES.filter(function(n){ return !r.has(n.id); }).length;
  var b = $('#badge');
  b.hidden = unread === 0; b.textContent = unread;

  var home = $('#homeNotice');
  if (NOTICES.length) {
    var shown = NOTICES.slice(0, HOME_MAX), rest = NOTICES.length - shown.length;
    home.hidden = false;
    home.innerHTML = shown.map(function(n){ return noticeRow(n, !r.has(n.id)); }).join('')
      + (rest ? '<button class="more" type="button" data-goto="info">過去のお知らせを見る<em>ほかに' + rest + '件 ›</em></button>' : '');
  } else {
    home.hidden = true; home.innerHTML = '';
  }

  if (!NOTICES.length && noticeError) {
    home.hidden = false;
    home.innerHTML = '<button class="more" type="button" data-reload-notice>お知らせを読み込めませんでした<em>もう一度読み込む ›</em></button>';
  }

  $('#allNotice').innerHTML =
    (NOTICES.length
      ? NOTICES.map(function(n){ return noticeRow(n, !r.has(n.id)); }).join('')
      : noticeError
        ? '<div class="empty">お知らせを読み込めませんでした。<br>' + esc(noticeError) + '</div>'
          + '<button class="more" type="button" data-reload-notice>もう一度読み込む<em>›</em></button>'
        : '<div class="empty">現在お知らせはありません。<br>投稿するとここに残ります。</div>')
    + '<a class="more go" href="' + esc(NOTICE_POST) + '">掲示板に投稿する<em>›</em></a>';

  Array.prototype.forEach.call(document.querySelectorAll('.nt > button'), function(btn){
    btn.addEventListener('click', function(){
      var nt = btn.parentElement, open = nt.hasAttribute('open');
      nt.toggleAttribute('open', !open);
      btn.setAttribute('aria-expanded', String(!open));
      if (open) return;
      var dot = nt.querySelector('.u');
      if (!dot) return;
      markRead(nt.dataset.id);
      var left = NOTICES.filter(function(n){ return !readSet().has(n.id); }).length;
      b.hidden = left === 0; b.textContent = left;
      Array.prototype.forEach.call(document.querySelectorAll('.nt'), function(el){
        if (el.dataset.id !== nt.dataset.id) return; // ホームと一覧の両方を既読にする
        el.classList.add('read');
        var d = el.querySelector('.u'); if (d) d.remove();
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-goto]'), function(el){
    if (el.dataset.bound) return;   // 描き直しのたびに同じ処理を重ねて付けない
    el.dataset.bound = '1';
    el.addEventListener('click', function(){ go(el.dataset.goto); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-reload-notice]'), function(el){
    el.addEventListener('click', loadNotices);
  });
}
paintNotices();

function loadNotices(){
  if (!NOTICE_API || NOTICE_API.indexOf('http') !== 0) return;
  GasClient.get(NOTICE_API)
    .then(function(data){
      if (!data || !data.ok) throw new Error((data && data.error) || '読み込みに失敗しました');
      noticeError = '';
      NOTICES = (data.items || []).map(normalize);
      paintNotices();
    })
    .catch(function(err){
      noticeError = err.message;
      paintNotices();
    });
}
loadNotices();

/* ═══ タブ ═══ */
function go(v){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){
    x.setAttribute('aria-selected', x.dataset.v === v);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.view'), function(x){
    x.classList.remove('on', 'enter');
  });
  $('#v-' + v).classList.add('on');
  window.scrollTo({ top: 0 });
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
  t.addEventListener('click', function(){ go(t.dataset.v); });
});

/* スクロールしたらヘッダーに境界線を出す */
addEventListener('scroll', function(){
  $('#bar').classList.toggle('stuck', scrollY > 4);
}, { passive:true });

/* ═══ シート（名前・行き先の選択） ═══ */

/* 覆いの高さに、いま実際に見えている高さを入れる。
   CSSの vh / dvh はアドレスバーの出入りで基準がずれることがあり、
   アプリ内ブラウザだと下端がバーの裏に隠れてしまうため、実寸で押さえる。 */
function sheetFit(){
  var vv = window.visualViewport;
  var h = vv ? vv.height : window.innerHeight;
  var scrim = $('#scrim');
  scrim.style.height = h + 'px';
  scrim.style.top = (vv ? vv.offsetTop : 0) + 'px';
}
addEventListener('resize', function(){ if ($('#scrim').classList.contains('on')) sheetFit(); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function(){
    if ($('#scrim').classList.contains('on')) sheetFit();
  });
  window.visualViewport.addEventListener('scroll', function(){
    if ($('#scrim').classList.contains('on')) sheetFit();
  });
}

function sheet(on){
  if (on) sheetFit();
  $('#sheet').classList.toggle('on', on);
  $('#scrim').classList.toggle('on', on);
  /* 開いている間は後ろを動かさない */
  document.documentElement.style.overflow = on ? 'hidden' : '';
  document.body.style.overflow = on ? 'hidden' : '';
  if (on) $('#sheet').scrollTop = 0;   // 常に先頭（タイトル）から見せる
}
function sheetOpen(cfg){
  $('#sheetTitle').textContent = cfg.title;
  $('#sheetLead').innerHTML = cfg.lead || '';
  $('#sheetLead').hidden = !cfg.lead;

  var box = $('#picks');
  box.innerHTML = '';
  cfg.items.forEach(function(it){
    if (it.header) {
      var h = document.createElement('div');
      h.className = 'pick-head';
      h.textContent = it.header;
      box.appendChild(h);
      return;
    }
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pick';
    if (it.current) btn.setAttribute('aria-current', 'true');
    /* 名前の選択肢は頭文字、それ以外（行き先）は矢印にする */
    var mark = it.person ? esc(initial(it.label)) : '\u203A';
    btn.innerHTML = '<i>' + mark + '</i><span class="pt">' + esc(it.label)
      + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span>';
    btn.addEventListener('click', function(){ cfg.onPick(it); });
    box.appendChild(btn);
  });

  var clear = $('#sheetClear');
  clear.hidden = !cfg.allowClear;
  sheet(true);
}
$('#sheetClear').addEventListener('click', function(){ clearStaff(); sheet(false); });
$('#sheetCancel').addEventListener('click', function(){ sheet(false); });
$('#sheetX').addEventListener('click', function(){ sheet(false); });
/* 覆いの余白を押したときだけ閉じる（シート自体の操作では閉じない） */
$('#scrim').addEventListener('click', function(e){ if (e.target === this) sheet(false); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' || e.keyCode === 27) sheet(false);
});

/* ═══ 名前 ═══ */
function word(){
  var h = new Date().getHours();
  return h < 10 ? 'おはようございます' : h < 18 ? 'おつかれさまです' : 'おつかれさまでした';
}
/* 時間帯（あいさつのカードの色と、下のひとこと） */
function timeOfDay(){ var h = new Date().getHours(); return h < 10 ? 'morning' : h < 18 ? 'day' : 'night'; }
function paintWho(){
  var nm = getStaff(), b = $('#whoBtn');
  var tod = timeOfDay();
  document.documentElement.setAttribute('data-tod', tod);
  $('#greetSub').textContent = { morning:'今日もよろしくお願いします', day:'午後もいい調子でいきましょう', night:'今日もおつかれさまでした' }[tod];
  if (nm) {
    b.classList.remove('unset');
    $('#whoIni').textContent = initial(nm);
    $('#whoName').textContent = nm;
    $('#greet').textContent = nm + 'さん、' + word();
  } else {
    b.classList.add('unset');
    $('#whoIni').textContent = '?';
    $('#whoName').textContent = '名前を選ぶ';
    $('#greet').textContent = word();
  }
}
$('#whoBtn').addEventListener('click', function(){ pickPerson(); });

paintWho();
paintTools();
/* はじめて開いた端末では、まず名前を選んでもらう */
if (!getStaff()) setTimeout(function(){ pickPerson(); }, 350);

/* ═══ オフライン表示 ═══ */
(function(){
  var el = $('#offline');
  function sync(){ el.classList.toggle('show', !navigator.onLine); }
  addEventListener('online', sync);
  addEventListener('offline', sync);
  sync();
})();

/* ═══ ホーム画面に追加（Android / デスクトップChrome）═══ */
(function(){
  var bar = $('#install'), deferred = null;
  addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; bar.classList.add('show');
  });
  bar.addEventListener('click', function(){
    if (!deferred) return;
    bar.classList.remove('show');
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; });
  });
  addEventListener('appinstalled', function(){ deferred = null; bar.classList.remove('show'); });
})();

/* ═══ Service Worker（オフライン対応）═══ */
if ('serviceWorker' in navigator) {
  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* 失敗しても通常ページとして動く */ });
  });
}
</script>
