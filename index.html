<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sieg OPS BOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #090E1C;
    --board:    #10182D;
    --panel:    rgba(22, 31, 56, 0.72);
    --panel-hi: rgba(32, 44, 78, 0.85);
    --line:     rgba(58, 72, 118, 0.55);
    --amber:    #F5AE3D;
    --amber-hi: #FFD98A;
    --amber-dp: #6E5320;
    --green:    #4ED9A4;
    --text:     #EDF1FA;
    --muted:    #93A0BE;
    --muted2:   #5E6A8C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--ink);
    color: var(--text);
    min-height: 100vh;
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(1100px 500px at 50% -10%, rgba(245,174,61,0.10), transparent 65%),
      radial-gradient(900px 480px at 50% 115%, rgba(78,217,164,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
    background-attachment: fixed;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(24px + env(safe-area-inset-top,0)) 16px calc(36px + env(safe-area-inset-bottom,0));
  }

  .board-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--line);
    padding-bottom: 14px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--amber);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: '';
    width: 8px; height: 8px; border-radius: 2px;
    background: var(--amber);
    box-shadow: 0 0 8px rgba(245,174,61,0.8);
    animation: beacon 2.4s ease-in-out infinite;
  }
  @keyframes beacon { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .title {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 900;
    font-size: 27px;
    letter-spacing: 1px;
    white-space: nowrap;
    line-height: 1.1;
  }
  .title span {
    display: inline-block;
    opacity: 0;
    transform: rotateX(92deg);
    transform-origin: center 60%;
    animation: flap 0.45s cubic-bezier(.2,.75,.3,1.05) forwards;
  }
  @keyframes flap { to { opacity: 1; transform: rotateX(0); } }

  .greet {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }

  .clock-box { text-align: right; flex-shrink: 0; padding-left: 14px; }
  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(245,174,61,0.35);
    line-height: 1;
  }
  .clock .colon { animation: beacon 1s steps(1) infinite; }
  .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    margin-top: 6px;
  }

  /* ═══ ティッカー ═══ */
  .ticker {
    margin: 12px 0 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--board);
    overflow: hidden;
    display: flex;
    align-items: stretch;
  }
  .ticker-tag {
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--ink);
    background: var(--amber);
    display: flex; align-items: center;
    padding: 0 10px;
    font-weight: 700;
  }
  .ticker-view { overflow: hidden; flex: 1; position: relative; height: 34px; }
  .ticker-track {
    position: absolute; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--amber-hi);
    line-height: 34px;
    padding-left: 100%;
    animation: ticker 26s linear infinite;
  }
  @keyframes ticker { to { transform: translateX(-100%); } }

  /* ═══ カラム見出し ═══ */
  .col-heads {
    display: grid;
    grid-template-columns: 44px 1fr 84px 18px;
    gap: 10px;
    padding: 0 16px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    color: var(--muted2);
  }

  /* ═══ ボード行 ═══ */
  .board { display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr 84px 18px;
    align-items: center;
    gap: 10px;
    padding: 18px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber-dp);
    border-radius: 12px;
    opacity: 0;
    animation: rise 0.5s ease forwards;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    position: relative;
    overflow: hidden;
  }
  .row::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.045) 48%, transparent 62%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .row.active:active {
    transform: scale(0.975);
    border-color: var(--amber);
    border-left-color: var(--amber);
    background: var(--panel-hi);
  }
  .row.active:active::after { transform: translateX(120%); transition: transform 0.5s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .gate {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--amber);
    text-shadow: 0 0 10px rgba(245,174,61,0.3);
  }
  .gate small {
    display: block;
    font-size: 8px;
    letter-spacing: 1.5px;
    color: var(--muted2);
    text-shadow: none;
    margin-top: 2px;
  }

  .name-block .name {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .name-block .desc {
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    justify-content: flex-end;
    color: var(--green);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    flex-shrink: 0;
    animation: beacon 3s ease-in-out infinite;
  }

  .arrow { color: var(--amber); font-size: 20px; text-align: right; font-weight: 700; }

  /* ═══ フッター ═══ */
  .foot {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    font-size: 11px;
    color: var(--muted2);
    line-height: 1.9;
    text-align: center;
    font-family: 'JetBrains Mono', 'Noto Sans JP', monospace;
    letter-spacing: 0.5px;
  }
  .foot b { color: var(--muted); }

  /* ═══ 搭乗券オーバーレイ ═══ */
  .staff-overlay {
    position: fixed; inset: 0;
    background: rgba(7,11,22,0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 22px;
  }
  .staff-overlay.show { display: flex; }
  .staff-box {
    width: 100%;
    max-width: 350px;
    background: linear-gradient(170deg, #1B2745 0%, #131C36 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
    animation: pass-in 0.28s cubic-bezier(.2,.8,.3,1.1);
    position: relative;
  }
  @keyframes pass-in {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pass-head {
    background: var(--amber);
    color: var(--ink);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pass-head .ph-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 700;
  }
  .pass-head .ph-brand {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .pass-perf {
    position: relative;
    height: 0;
    border-top: 2px dashed rgba(255,255,255,0.14);
    margin: 0 0;
  }
  .pass-perf::before, .pass-perf::after {
    content: '';
    position: absolute;
    top: -9px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(7,11,22,0.88);
  }
  .pass-perf::before { left: -10px; }
  .pass-perf::after  { right: -10px; }

  .pass-body { padding: 20px; }
  .staff-title {
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  .staff-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .staff-btn {
    width: 100%;
    padding: 15px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
    cursor: pointer;
    min-height: 54px;
    letter-spacing: 1px;
    transition: transform 0.08s ease;
  }
  .staff-btn:active {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
    transform: scale(0.97);
  }
  .staff-back {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }
  .pass-foot {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--muted2);
    text-align: center;
    padding: 0 20px 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    .title span { animation: none; opacity: 1; transform: none; }
    .row { animation: none; opacity: 1; }
    .ticker-track { animation: none; padding-left: 12px; }
    .dot, .eyebrow::before, .clock .colon { animation: none; }
    .staff-box { animation: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="board-head">
    <div>
      <div class="eyebrow">SIEG OPS BOARD</div>
      <div class="title" id="title"></div>
      <div class="greet" id="greet"></div>
    </div>
    <div class="clock-box">
      <div class="clock" id="clock">--<span class="colon">:</span>--</div>
      <div class="date" id="date">----/--/-- ---</div>
    </div>
  </div>

  <div class="ticker">
    <div class="ticker-tag">INFO</div>
    <div class="ticker-view">
      <div class="ticker-track" id="ticker-track"></div>
    </div>
  </div>

  <div class="col-heads">
    <div>GATE</div>
    <div>TOOL</div>
    <div style="text-align:right;">STATUS</div>
    <div></div>
  </div>

  <div class="board" id="board">
    <a href="#" class="row active" data-id="keihi" data-mode="staff" data-url="https://sakusakusansan-star.github.io/keihi23/" data-staff='["福山","古川","清田"]' onclick="return goTo(this)" style="animation-delay:.05s">
      <div class="gate">K1<small>GATE</small></div>
      <div class="name-block">
        <div class="name">経費精算</div>
        <div class="desc">領収書をAIで自動読み取り</div>
      </div>
      <div class="status"><span class="dot"></span>運行中</div>
      <div class="arrow">›</div>
    </a>

    <a href="#" class="row active" data-id="shift" data-mode="category"
       data-options='[
         {"label":"Sieg社員","type":"link","url":"https://docs.google.com/spreadsheets/d/1wRBlTC_U2Mek5xj1YDFUEuAdRRlcVGZGIy_3WmmJLsQ/edit?usp=sharing"},
         {"label":"パートナー様","type":"link","url":"https://sakusakusansan-star.github.io/shift-form/"}
       ]'
       onclick="return goTo(this)" style="animation-delay:.14s">
      <div class="gate">S2<small>GATE</small></div>
      <div class="name-block">
        <div class="name">シフト入力</div>
        <div class="desc">スタッフのシフトを登録</div>
      </div>
      <div class="status"><span class="dot"></span>運行中</div>
      <div class="arrow">›</div>
    </a>

    <a href="#" class="row active" data-id="commute" data-mode="category"
       data-options='[
         {"label":"Sieg社員","type":"link","url":"https://docs.google.com/spreadsheets/d/1shpJvauT5rwKCaWH9RQBNZt3DzAA11yD5jNFUg2c6d4/edit?usp=sharing"},
         {"label":"山口","type":"link","url":"https://docs.google.com/spreadsheets/d/1RRLf47jjFvL1MdFvkt43GdSsw_r7NLQOqOQzRCEwmpA/edit?usp=sharing"}
       ]'
       onclick="return goTo(this)" style="animation-delay:.23s">
      <div class="gate">T3<small>GATE</small></div>
      <div class="name-block">
        <div class="name">交通費計算</div>
        <div class="desc">通勤距離・交通費の自動計算</div>
      </div>
      <div class="status"><span class="dot"></span>運行中</div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="foot">
    うまく開けない場合は、リンクを長押しして<br>
    <b>「他のブラウザで開く」</b>を選んでください
  </div>

</div>

<!-- 搭乗券風 選択オーバーレイ -->
<div id="staff-overlay" class="staff-overlay" onclick="overlayBgClose(event)">
  <div class="staff-box">
    <div class="pass-head">
      <span class="ph-label" id="ov-eyebrow">BOARDING PASS</span>
      <span class="ph-brand">SIEG OPS</span>
    </div>
    <div class="pass-perf"></div>
    <div class="pass-body">
      <div class="staff-title" id="ov-title">あなたの名前を選んでください</div>
      <div class="staff-buttons" id="staff-buttons"></div>
      <div class="staff-back" id="ov-back" style="display:none;" onclick="backToCategory()">‹ 戻る</div>
    </div>
    <div class="pass-foot">SIEG OPERATIONS PORTAL ★ KUMAMOTO</div>
  </div>
</div>

<script>
  var titleText = "Sieg 業務ポータル";
  var titleEl = document.getElementById('title');
  titleText.split('').forEach(function(ch, i) {
    var span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 0.04) + 's';
    titleEl.appendChild(span);
  });

  var DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function tick() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2,'0');
    var mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').innerHTML = hh + '<span class="colon">:</span>' + mm;
    var y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
    document.getElementById('date').textContent = y + '/' + m + '/' + d + ' ' + DOW[now.getDay()];

    var h = now.getHours();
    var greet;
    if (h < 5)       greet = '深夜の作業、おつかれさまです';
    else if (h < 11) greet = 'おはようございます。本日も安全運行で';
    else if (h < 17) greet = 'おつかれさまです';
    else             greet = 'おつかれさまです。本日もあと少し';
    document.getElementById('greet').textContent = greet;
  }
  tick();
  setInterval(tick, 1000 * 10);

  var TICKER_MSGS = [
    '経費精算：領収書は撮影するだけでAIが自動読み取りします',
    'シフト入力：カレンダーで開始日と終了日をタップするだけ',
    '交通費計算：通勤距離から自動で金額を算出します',
    'ページがうまく開かないときは、一度閉じてポータルから入り直してください'
  ];
  document.getElementById('ticker-track').textContent = TICKER_MSGS.join('　◆　') + '　◆　';

  var STAFF_KEY_PREFIX = "siegStaff_";
  var pendingRow = null;
  var pendingCategoryOptions = null;

  function keyFor(id) { return STAFF_KEY_PREFIX + id; }

  function navigateWithStaff(url, name) {
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    window.location.href = url + sep + 'staff=' + encodeURIComponent(name) + '&v=' + Date.now();
  }
  function navigateDirect(url) {
    window.location.href = url;
  }

  function openStaffOverlay(list) {
    document.getElementById('ov-eyebrow').textContent = 'BOARDING PASS';
    document.getElementById('ov-title').textContent = 'あなたの名前を選んでください';
    var box = document.getElementById('staff-buttons');
    box.innerHTML = '';
    list.forEach(function(name) {
      var btn = document.createElement('button');
      btn.className = 'staff-btn';
      btn.textContent = name;
      btn.onclick = function() { chooseStaffName(name); };
      box.appendChild(btn);
    });
    document.getElementById('ov-back').style.display = pendingCategoryOptions ? 'block' : 'none';
    document.getElementById('staff-overlay').classList.add('show');
  }

  function chooseStaffName(name) {
    if (!pendingRow) return;
    var id = pendingRow.getAttribute('data-id');
    var mode = pendingRow.getAttribute('data-mode');
    document.getElementById('staff-overlay').classList.remove('show');

    if (mode === 'staff') {
      localStorage.setItem(keyFor(id), name);
      var url = pendingRow.getAttribute('data-url');
      pendingRow = null;
      navigateWithStaff(url, name);
    } else if (mode === 'category' && pendingCategoryOptions) {
      var url = pendingCategoryOptions.url;
      pendingRow = null;
      pendingCategoryOptions = null;
      navigateWithStaff(url, name);
    }
  }

  function openCategoryOverlay(row) {
    var options = JSON.parse(row.getAttribute('data-options') || '[]');
    document.getElementById('ov-eyebrow').textContent = 'SELECT GATE';
    document.getElementById('ov-title').textContent = '対象を選んでください';
    var box = document.getElementById('staff-buttons');
    box.innerHTML = '';
    options.forEach(function(opt) {
      var btn = document.createElement('button');
      btn.className = 'staff-btn';
      btn.textContent = opt.label;
      btn.onclick = function() { chooseCategory(opt); };
      box.appendChild(btn);
    });
    document.getElementById('ov-back').style.display = 'none';
    document.getElementById('staff-overlay').classList.add('show');
  }

  function chooseCategory(opt) {
    if (opt.type === 'link') {
      document.getElementById('staff-overlay').classList.remove('show');
      pendingRow = null;
      pendingCategoryOptions = null;
      navigateDirect(opt.url);
    } else if (opt.type === 'staff') {
      pendingCategoryOptions = opt;
      openStaffOverlay(opt.staff);
    }
  }

  function backToCategory() {
    if (!pendingRow) return;
    pendingCategoryOptions = null;
    openCategoryOverlay(pendingRow);
  }

  function overlayBgClose(e) {
    if (e.target === document.getElementById('staff-overlay')) {
      document.getElementById('staff-overlay').classList.remove('show');
      pendingRow = null;
      pendingCategoryOptions = null;
    }
  }

  function goTo(el) {
    var mode = el.getAttribute('data-mode');
    pendingRow = el;

    if (mode === 'staff') {
      var id = el.getAttribute('data-id');
      var url = el.getAttribute('data-url');
      var name = localStorage.getItem(keyFor(id));
      if (name) {
        pendingRow = null;
        navigateWithStaff(url, name);
      } else {
        openStaffOverlay(JSON.parse(el.getAttribute('data-staff') || '[]'));
      }
    } else if (mode === 'category') {
      openCategoryOverlay(el);
    }
    return false;
  }
</script>

</body>
</html>
