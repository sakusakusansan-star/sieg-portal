<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>みんなの状況｜Sieg 業務ポータル</title>
<meta name="description" content="今月の獲得・日報の提出・稼働費・経費精算を、全員まとめて見るページ。">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1017" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="sieg-theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  /* ───────── このページだけの配色（sieg-theme.css は触らない） ───────── */
  .app {
    --t-bg: #EEF1F5; --t-card: #FFFFFF; --t-sunk: #F3F5F9;
    --t-ink: #0B1522; --t-ink2: #39485A; --t-mute: #6B7787; --t-faint: #9AA4B2;
    --t-hair: #E2E7ED; --t-hair2: #EDF0F4;
    --t-navy1: #101C2E; --t-navy2: #25415F;
    --t-accent: #2B6CB0; --t-green: #177A4C; --t-red: #B3312A; --t-gold: #A9791F;
    --t-green-tint: #E6F2EB; --t-red-tint: #FAEBE9; --t-accent-tint: #E9F0F8; --t-gold-tint: #F8F0DF;
    --t-cat-mnp: #2B6CB0; --t-cat-fix: #177A4C; --t-cat-dev: #A9791F; --t-cat-card: #6B4E9E; --t-cat-new: #8A93A0;
    --t-rank: #AAB3BF; --t-on-dark: #FFFFFF;
    --t-lift: 0 10px 26px -12px rgba(13,25,42,.16);
    --t-r: 20px; --t-r-sm: 12px;
    --t-font: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .app {
      --t-bg: #0B1017; --t-card: #151C26; --t-sunk: #1B232E;
      --t-ink: #EDF2F8; --t-ink2: #BCC6D2; --t-mute: #8C97A5; --t-faint: #626D7B;
      --t-hair: #26303C; --t-hair2: #1F2731;
      --t-navy1: #1A2B42; --t-navy2: #2E4A6B;
      --t-accent: #7FAEE8; --t-green: #5FC48C; --t-red: #F0847A; --t-gold: #D8AC55;
      --t-green-tint: #14261F; --t-red-tint: #2A1917; --t-accent-tint: #172232; --t-gold-tint: #272015;
      --t-cat-mnp: #7FAEE8; --t-cat-fix: #5FC48C; --t-cat-dev: #D8AC55; --t-cat-card: #A98FD8; --t-cat-new: #9AA3B0;
      --t-rank: #4A5665;
      --t-lift: 0 10px 26px -14px rgba(0,0,0,.5);
    }
    .kpi.hero { border-color: #35506F; }
    .reload { border: 1px solid #35506F; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; background: #EEF1F5; }
  @media (prefers-color-scheme: dark) { body { background: #0B1017; } }
  button { font: inherit; color: inherit; cursor: pointer; }
  .sieg-back a { font-family: var(--t-font, inherit); }

  .app {
    max-width: 1040px; margin: 0 auto;
    padding: 4px max(16px, env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 16px;
    background: var(--t-bg); color: var(--t-ink);
    font-family: var(--t-font); font-feature-settings: "palt"; letter-spacing: .012em;
  }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--t-mute); }

  /* ───────── ヘッダー ───────── */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark {
    width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--t-navy2), var(--t-navy1));
    color: var(--t-on-dark); font-weight: 900; font-size: 20px; letter-spacing: .04em;
    box-shadow: var(--t-lift);
  }
  h1 { margin: 1px 0 0; font-size: clamp(22px, 4.4vw, 28px); font-weight: 900; letter-spacing: .03em; line-height: 1.18; }
  .headr { display: flex; align-items: center; gap: 8px; flex: none; }
  .pill {
    display: inline-flex; align-items: center; min-height: 36px; padding: 0 13px; border-radius: 999px;
    background: var(--t-card); border: 1px solid var(--t-hair); box-shadow: var(--t-lift);
    font-size: 12.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap;
  }
  .reload {
    min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0;
    background: linear-gradient(145deg, var(--t-navy2), var(--t-navy1)); color: var(--t-on-dark);
    font-size: 13.5px; font-weight: 800; letter-spacing: .04em; box-shadow: var(--t-lift);
    transition: transform .06s, filter .12s;
  }
  .reload:active { filter: brightness(.9); transform: scale(.98); }
  .reload:disabled { opacity: .5; transform: none; filter: none; cursor: default; }
  .sub { font-size: 12px; font-weight: 700; color: var(--t-mute); margin-top: -8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ───────── サマリー3枚 ───────── */
  .kpis { display: grid; grid-template-columns: 1.25fr 1fr 1.25fr; gap: 12px; }
  .kpi {
    background: var(--t-card); border: 1px solid var(--t-hair); border-radius: var(--t-r);
    box-shadow: var(--t-lift); padding: 14px 16px 15px; min-width: 0;
  }
  .kpi .k { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--t-mute); }
  .kpi .v { font-size: clamp(24px, 4vw, 30px); font-weight: 900; line-height: 1.1; margin-top: 4px; }
  .kpi .v small { font-size: 12.5px; font-weight: 800; color: var(--t-mute); margin-left: 3px; letter-spacing: 0; }
  .kpi .s { font-size: 11.5px; font-weight: 700; color: var(--t-mute); margin-top: 5px; line-height: 1.55; overflow-wrap: anywhere; }
  .kpi.hero {
    background: linear-gradient(140deg, var(--t-navy2), var(--t-navy1)); border-color: transparent; color: var(--t-on-dark);
  }
  .kpi.hero .k, .kpi.hero .s, .kpi.hero .v small { color: rgba(255,255,255,.72); }
  .kpi.alert { border-color: color-mix(in srgb, var(--t-red) 40%, var(--t-hair)); background: var(--t-red-tint); }
  .kpi.alert .v { color: var(--t-red); }
  .kpi.alert .s { color: var(--t-red); font-weight: 800; }

  /* ───────── 今月の内訳 ───────── */
  .mix { background: var(--t-card); border: 1px solid var(--t-hair); border-radius: var(--t-r); box-shadow: var(--t-lift); padding: 14px 16px 16px; }
  .mix-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .mix-h .t { font-size: 12.5px; font-weight: 800; color: var(--t-mute); }
  .stack { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--t-sunk); margin-top: 10px; }
  .stack i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 11px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--t-ink2); }
  .lg .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .lg b { font-weight: 900; color: var(--t-ink); font-variant-numeric: tabular-nums; }

  /* ───────── 並べ替え ───────── */
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--t-sunk); border: 1px solid var(--t-hair); border-radius: var(--t-r-sm); }
  .seg button { border: 0; background: none; min-height: 36px; padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 800; color: var(--t-mute); }
  .seg button[aria-pressed="true"] { background: var(--t-card); color: var(--t-ink); box-shadow: 0 1px 3px rgba(13,25,42,.14); }

  /* ───────── 一覧 ───────── */
  .tcard { background: var(--t-card); border: 1px solid var(--t-hair); border-radius: var(--t-r); box-shadow: var(--t-lift); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th, td { padding: 13px 12px; text-align: right; font-size: 14px; white-space: nowrap; }
  td { border-top: 1px solid var(--t-hair2); }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--t-sunk); color: var(--t-mute);
    font-size: 11px; font-weight: 800; letter-spacing: .06em;
  }
  thead th:first-child { border-top-left-radius: var(--t-r); }
  thead th:last-child { border-top-right-radius: var(--t-r); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--t-r); }
  tbody tr:last-child td:last-child { border-bottom-right-radius: var(--t-r); }
  th.c-rank, td.c-rank { text-align: center; padding-left: 14px; padding-right: 6px; width: 48px; }
  th.c-name, td.c-name { text-align: left; }
  td.c-name .who { display: flex; align-items: center; gap: 9px; }
  td.c-name b { font-size: 14.5px; font-weight: 900; display: block; line-height: 1.25; }
  td.c-name small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--t-mute); margin-top: 1px; }

  .rk { display: inline-grid; place-items: center; width: 27px; height: 27px; border-radius: 9px;
    font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; color: #fff; background: var(--t-rank); }
  .rk.r1 { background: linear-gradient(145deg, #EDCB74, #B4831F); color: #2A1D00; }
  .rk.r2 { background: linear-gradient(145deg, #E2E7EC, #9FABB9); color: #212A34; }
  .rk.r3 { background: linear-gradient(145deg, #E3AC7C, #AC6B36); color: #2B1703; }

  .av { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center;
    font-size: 13px; font-weight: 900; color: #fff; }
  .av.staff { background: linear-gradient(145deg, #27405F, #101C2E); }
  .av.partner { background: linear-gradient(145deg, #1E8A5A, #0F5E3D); }

  .big { font-size: 15px; font-weight: 900; }
  .pt { font-size: 16px; font-weight: 900; letter-spacing: .01em; }
  .mini { display: block; width: 72px; height: 4px; border-radius: 3px; background: var(--t-sunk); margin: 6px 0 0 auto; overflow: hidden; }
  .mini i { display: block; height: 100%; border-radius: 3px; background: var(--t-accent); }
  .mini.pw i { background: linear-gradient(90deg, var(--t-navy2), var(--t-accent)); }
  .dim { color: var(--t-faint); font-weight: 700; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 4px 10px; min-height: 24px; }
  .tag.ok { background: var(--t-green-tint); color: var(--t-green); }
  .tag.ng { background: var(--t-red-tint); color: var(--t-red); }
  .small { display: block; font-size: 10.5px; font-weight: 700; color: var(--t-mute); margin-top: 3px; white-space: nowrap; }
  .err { font-size: 12px; font-weight: 800; color: var(--t-red); }
  .wait { color: var(--t-faint); font-weight: 800; letter-spacing: .1em; }

  @media (min-width: 841px) and (max-width: 1039px) {
    th, td { padding: 11px 7px; font-size: 13px; }
    .pt { font-size: 15px; }
    td.c-name b { font-size: 13.5px; }
    .av { width: 28px; height: 28px; font-size: 12px; }
  }

  /* ───────── 840px以下：1人1枚のカード ───────── */
  @media (max-width: 840px) {
    .kpis { grid-template-columns: 1fr; }
    table, thead, tbody, tr, td { display: block; }
    .tcard { background: none; border: 0; box-shadow: none; border-radius: 0; }
    thead { display: none; }
    tbody { display: flex; flex-direction: column; gap: 10px; }
    tr {
      position: relative; background: var(--t-card); border: 1px solid var(--t-hair);
      border-radius: var(--t-r); box-shadow: var(--t-lift);
      display: grid; grid-template-columns: 1fr 1fr; padding: 4px 14px 12px;
    }
    td { border: 0; border-top: 0; padding: 9px 0 0; text-align: left; white-space: normal; }
    tbody tr:last-child td:first-child, tbody tr:last-child td:last-child { border-radius: 0; }
    td.c-rank { position: absolute; top: 11px; right: 12px; width: auto; padding: 0; }
    td.c-name { grid-column: 1 / -1; padding: 12px 44px 2px 0; }
    td[data-k]::before {
      content: attr(data-k); display: block; font-size: 10px; font-weight: 800; letter-spacing: .08em;
      color: var(--t-mute); margin-bottom: 3px;
    }
    .mini { width: 110px; margin-left: 0; }
    .small { white-space: normal; }
  }

  /* ───────── 経費・稼働費 ───────── */
  .sec { margin: 6px 0 -4px; font-size: 16px; font-weight: 900; letter-spacing: .03em; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sec button { font-size: 12.5px; font-weight: 800; color: var(--t-accent); background: none; border: 0; padding: 8px 2px; min-height: 36px; }
  .money { display: flex; flex-direction: column; gap: 10px; }
  .mcard { background: var(--t-card); border: 1px solid var(--t-hair); border-radius: var(--t-r); box-shadow: var(--t-lift); overflow: hidden; }
  .mcard > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 13px 16px; }
  .mcard > summary::-webkit-details-marker { display: none; }
  .mcard .mn { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .mcard .mn b { font-size: 14.5px; font-weight: 900; }
  .mcard .mn small { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--t-mute); margin-left: 6px; }
  .mcard .mt { font-size: 19px; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
  .mcard .mt::after { content: '›'; display: inline-block; margin-left: 10px; color: var(--t-faint); transition: transform .15s; }
  .mcard[open] .mt::after { transform: rotate(90deg); }
  .mcard .mv { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: baseline; gap: 5px; font-size: 12px; font-weight: 700; color: var(--t-ink2); background: var(--t-sunk); border-radius: 999px; padding: 4px 11px; }
  .chip b { font-weight: 900; color: var(--t-ink); font-variant-numeric: tabular-nums; }
  .chip.c { background: var(--t-green-tint); color: var(--t-green); } .chip.c b { color: var(--t-green); }
  .chip.k { background: var(--t-accent-tint); color: var(--t-accent); } .chip.k b { color: var(--t-accent); }
  .chip.warn { background: var(--t-gold-tint); color: var(--t-gold); } .chip.warn b { color: var(--t-gold); }
  .mbody { border-top: 1px solid var(--t-hair2); display: grid; grid-template-columns: 1fr 1fr; }
  .mblock { padding: 13px 16px 15px; min-width: 0; }
  .mblock + .mblock { border-left: 1px solid var(--t-hair2); }
  .mblock h3 { margin: 0 0 9px; font-size: 12.5px; font-weight: 900; letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
  .mblock h3 span { color: var(--t-mute); font-weight: 700; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .parts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .bars { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .brow { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }
  .brow .bl { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .bb { height: 8px; background: var(--t-sunk); border-radius: 4px; overflow: hidden; }
  .brow .bb i { display: block; height: 100%; background: var(--t-accent); border-radius: 4px; }
  .brow .bv { font-weight: 800; font-variant-numeric: tabular-nums; }
  .lines { display: flex; flex-direction: column; }
  .lrow { display: grid; grid-template-columns: 3.6em 1fr auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--t-hair2); font-size: 12.5px; align-items: baseline; }
  .lrow:first-child { border-top: 0; }
  .lrow .d { color: var(--t-mute); font-weight: 800; font-variant-numeric: tabular-nums; }
  .lrow .t { min-width: 0; overflow-wrap: anywhere; }
  .lrow .t small { display: block; color: var(--t-mute); font-size: 11px; }
  .lrow .a { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .mempty { font-size: 12.5px; color: var(--t-mute); padding: 6px 0; font-weight: 700; }
  .mblock .src { font-size: 11px; color: var(--t-mute); margin-top: 9px; line-height: 1.6; }
  @media (max-width: 840px) {
    .mbody { grid-template-columns: 1fr; }
    .mblock + .mblock { border-left: 0; border-top: 1px solid var(--t-hair2); }
  }

  .note { font-size: 12px; color: var(--t-mute); line-height: 1.75; margin: 2px 0 0; }

  /* ───────── 読み込み中・エラー ───────── */
  .state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 56px 16px; color: var(--t-mute); font-size: 13.5px; font-weight: 800; text-align: center; line-height: 1.7; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--t-hair); border-top-color: var(--t-accent); animation: sg-spin .7s linear infinite; }
  @keyframes sg-spin { to { transform: rotate(360deg); } }
  .state[hidden], .kpis[hidden], .tcard[hidden], .bar[hidden], .mix[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .reload, .mcard .mt::after { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div data-sieg-back></div>

  <header class="head">
    <div class="brand">
      <div class="mark" aria-hidden="true">S</div>
      <div>
        <div class="eyebrow">Sieg 業務ポータル</div>
        <h1>みんなの状況</h1>
      </div>
    </div>
    <div class="headr">
      <span class="pill num" id="month-pill">—</span>
      <button type="button" class="reload" id="reload">更新</button>
    </div>
  </header>
  <div class="sub" id="sub">読み込み中…</div>

  <section class="kpis" id="kpis" hidden></section>

  <section class="mix" id="mix" hidden>
    <div class="mix-h"><span class="eyebrow">今月の内訳</span><span class="t num" id="mix-total"></span></div>
    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="bar" id="bar" hidden>
    <div class="seg" role="group" aria-label="並べ方">
      <button type="button" data-sort="power" aria-pressed="true">戦闘力順</button>
      <button type="button" data-sort="roster" aria-pressed="false">名簿順</button>
    </div>
  </div>

  <div class="state" id="state"><span class="spin" aria-hidden="true"></span><span id="state-msg">読み込み中…</span></div>

  <div class="tcard" id="tcard" hidden>
    <table id="table">
      <thead>
        <tr>
          <th class="c-rank">#</th><th class="c-name">名前</th><th>獲得</th><th>戦闘力</th><th>MNP</th><th>固定</th>
          <th>日報（今日）</th><th>日報（今月）</th><th>稼働費 入力</th><th>稼働費 金額</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="money-wrap" hidden>
    <div class="sec"><span>経費・稼働費</span><button type="button" id="open-all">すべて開く</button></div>
    <div class="kpis" id="money-kpis" style="margin-top:12px"></div>
    <div class="money" id="money" style="margin-top:10px"></div>
  </div>

  <p class="note">
    獲得は獲得報告から、日報は日報フォームから、稼働費は稼働費入力（社員はシート、パートナー様は新しい画面）から、経費精算は経費精算のシートから読んでいます。<br>
    日報はパートナー様だけ、稼働費・経費精算は使っている人だけ出します（ほかは「—」）。社員の稼働費と経費精算は、シートで選んでいる月の分です。
  </p>
</div>

<script src="gas-client.js"></script>
<script src="sieg-nav.js"></script>
<script src="sieg-roster.js"></script>
<script src="sieg-products.js"></script>
<script>
(function () {
  'use strict';
  var R = window.SiegRoster, P = window.SiegProducts;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString('ja-JP'); }
  if (!R || !P) { $('state-msg').textContent = '読み込みに失敗しました。再読み込みしてください。'; return; }

  // 稼働費の GAS（稼働費入力の index.html と同じ。山口さんだけ別のブック）
  var COMMUTE_GAS_DEFAULT = 'https://script.google.com/macros/s/AKfycbxp1cYnzgOMh4_ud5cEPJ7_b6qNFIm0YKt-sjFtBwXfeEHy_hMiZD0q2bPh-3vVOO15fA/exec';
  var COMMUTE_GAS = { '山口真人': 'https://script.google.com/macros/s/AKfycbwwALmDLzKteasiO0AMqAyRWsfb3p_AqgjkLZo-IBSctLDseudhes9hxJer7aGsdDkj/exec' };

  var PEOPLE = R.everyone;
  var NIPPOU = R.forTool('nippou'), COMMUTE = R.forTool('commute');
  var sortBy = 'power';

  function todayYmd() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // パートナー様の新しい稼働費（commute-form/partner.html）。山口さんは12月分から
  var PARTNER_NEW_FROM = { '山口': '2026-12' };
  function usesPartnerCommute(name) {
    if (!R.isPartner(name)) return false;
    var from = PARTNER_NEW_FROM[name];
    return !from || todayYmd().slice(0, 7) >= from;
  }

  // 稼働費：1人ずつ（入力日数は getMonthInfo、金額は getMyEntries）
  function commuteOf(name) {
    if (usesPartnerCommute(name)) {
      if (!R.commutePartnerApi) return Promise.resolve({ pending: true });
      var ym = todayYmd().slice(0, 7);
      return GasClient.post(R.commutePartnerApi, { action: 'listMonth', name: name, ym: ym }, { retry: true }).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.error) || '読めませんでした');
        var t = r.data.totals, files = r.data.files || [];
        return { month: Number(ym.slice(5)), days: t.days, irregular: t.routes, amount: t.total, routes: true,
          parts: [['ガソリン代', t.gas], ['高速代', t.toll], ['駐車場代', t.parking]], km: t.km,
          files: { receipts: files.filter(function (f) { return f.kind !== 'ETC'; }).length, etc: files.filter(function (f) { return f.kind === 'ETC'; }).length },
          lines: r.data.entries.map(function (e) {
            var extra = [];
            if (e.toll) extra.push('高速 ¥' + fmt(e.toll));
            if (e.parking) extra.push('駐車 ¥' + fmt(e.parking));
            return { d: Number(e.date.slice(5, 7)) + '/' + Number(e.date.slice(8)), t: e.text, sub: e.km + 'km' + (extra.length ? '・' + extra.join('・') : '') + (e.note ? '・' + e.note : ''), a: e.total };
          }) };
      }).catch(function (e) { return { error: e.message }; });
    }
    var full = R.fullName(name);
    if (!full) return Promise.resolve({ error: '名簿にフルネームがありません' });
    var url = COMMUTE_GAS[full] || COMMUTE_GAS_DEFAULT;
    return Promise.all([
      GasClient.post(url, { action: 'getMonthInfo', staffName: full }, { retry: true }),
      GasClient.post(url, { action: 'getMyEntries', staffName: full }, { retry: true })
    ]).then(function (r) {
      if (!r[0] || !r[0].ok || !r[1] || !r[1].ok) throw new Error((r[0] && r[0].error) || (r[1] && r[1].error) || '読めませんでした');
      var info = r[0].data, entries = r[1].data || [], sum = 0, toll = 0, irr = 0;
      entries.forEach(function (e) {
        var a = Number(e.amount) || 0;
        sum += a;
        if (e.type === 'irregular') irr += a;
        else toll += (Number(e.tollGo) || 0) + (Number(e.tollBack) || 0);
      });
      var lines = entries.slice().sort(function (a, b) { return (a.day || 99) - (b.day || 99); }).map(function (e) {
        var tl = (Number(e.tollGo) || 0) + (Number(e.tollBack) || 0);
        return e.type === 'irregular'
          ? { d: e.day ? info.month + '/' + e.day : '—', t: String(e.content || ''), sub: 'イレギュラー' + (e.note ? '・' + e.note : ''), a: Number(e.amount) || 0 }
          : { d: info.month + '/' + e.day, t: String(e.place || ''), sub: tl ? '高速 ¥' + fmt(tl) : (e.highway === '有' ? '高速あり' : ''), a: Number(e.amount) || 0 };
      });
      return { month: info.month, days: (info.filledDays || []).length, irregular: info.irregularCount || 0, amount: Math.round(sum),
        parts: [['距離の分', Math.round(sum - toll - irr)], ['高速代', Math.round(toll)], ['イレギュラー', Math.round(irr)]], lines: lines };
    }).catch(function (e) { return { error: e.message }; });
  }

  // 経費精算（経費精算の index.html と同じ GAS）
  var KEIHI_GAS = 'https://script.google.com/macros/s/AKfycbzyXEYU_0VhvEpnmZx3JWaxXRdOEP-Lam9R9Fxwv4nVRr6ExzQrBmdO-rgUlwGkcgzU/exec';
  var KEIHI = R.forTool('keihi');
  function keihiOf(name) {
    return Promise.all([
      GasClient.post(KEIHI_GAS, { action: 'getSheetInfo', staffName: name }, { retry: true }),
      GasClient.post(KEIHI_GAS, { action: 'getExpenses', staffName: name }, { retry: true })
    ]).then(function (r) {
      if (!r[0] || !r[0].ok || !r[1] || !r[1].ok) throw new Error((r[0] && r[0].error) || (r[1] && r[1].error) || '読めませんでした');
      var list = r[1].data || [], total = 0, by = {};
      list.forEach(function (e) {
        var a = Number(e.amount) || 0, k = String(e.item || 'その他');
        total += a; by[k] = (by[k] || 0) + a;
      });
      var items = Object.keys(by).map(function (k) { return [k, by[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
      var lines = list.map(function (e) {
        var d = e.date ? new Date(e.date) : null, ok = d && !isNaN(d);
        return { d: ok ? (d.getMonth() + 1) + '/' + d.getDate() : '—', t: String(e.item || ''), sub: String(e.description || ''), a: Number(e.amount) || 0 };
      });
      return { ym: String(r[0].data && r[0].data.yearMonth || ''), count: list.length, amount: Math.round(total), items: items, lines: lines };
    }).catch(function (e) { return { error: e.message }; });
  }

  /* ══════════════ ここから下は「見せ方」だけ ══════════════ */

  var CAT_VAR = { 'MNP': '--t-cat-mnp', '固定': '--t-cat-fix', '端末': '--t-cat-dev', 'カード': '--t-cat-card', '新規': '--t-cat-new' };
  var data = null, gen = 0, busy = false, waiting = 0, list = [], maxTotal = 1, maxPower = 1;

  function emptyData() {
    return { stats: null, nippou: null, commute: {}, keihi: {}, at: null, month: todayYmd().slice(0, 7) };
  }
  function monthLabel(ym) { return Number(String(ym).slice(0, 4)) + '年' + Number(String(ym).slice(5, 7)) + '月'; }
  function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function pct(v, max) { return Math.max(v > 0 ? 4 : 0, Math.round((v / (max || 1)) * 100)); }

  function stamp() {
    $('month-pill').textContent = monthLabel(data.month);
    var txt = data.at ? '最終更新 ' + hhmm(data.at) : '読み込み中…';
    if (waiting > 0 && data.at) txt += ' ・ 稼働費・経費を読み込み中（残り ' + waiting + '人）';
    else if (waiting > 0) txt += '（稼働費・経費 残り ' + waiting + '人）';
    $('sub').textContent = txt;
  }
  function showState(spinning, msg) {
    $('state').hidden = false;
    $('state').querySelector('.spin').hidden = !spinning;
    $('state-msg').textContent = msg;
  }

  function load() {
    var my = ++gen;
    busy = true;
    $('reload').disabled = true;
    data = emptyData();
    waiting = COMMUTE.length + KEIHI.length;
    stamp();
    if (!$('tcard').hidden) { /* 2回目以降は表を残したまま更新する */ } else showState(true, '読み込み中…');

    var pendingMain = true;
    function settled() {
      if (my !== gen) return;
      waiting = Math.max(0, waiting - 1);
      stamp();
      if (waiting === 0 && !pendingMain) { busy = false; $('reload').disabled = false; }
    }

    // 稼働費・経費精算は重いので切り離し、届いた人から順にセルへ入れる
    COMMUTE.forEach(function (n) {
      commuteOf(n).then(function (c) {
        if (my !== gen) return;
        data.commute[n] = c;
        if (data.stats) { paintCommuteCells(n); paintCommuteKpi(); renderMoney(); }
        settled();
      });
    });
    KEIHI.forEach(function (n) {
      keihiOf(n).then(function (k) {
        if (my !== gen) return;
        data.keihi[n] = k;
        if (data.stats) renderMoney();
        settled();
      });
    });

    // 獲得と日報が揃った時点で、まず KPI と表を出す
    return Promise.all([
      GasClient.get(P.API, { action: 'gainStats' }),
      GasClient.get(P.API, { action: 'nippouStatus' }).catch(function () { return null; })
    ]).then(function (r) {
      if (my !== gen) return;
      var stats = r[0], nip = r[1];
      if (!stats || !stats.ok || !stats.rows) throw new Error('獲得報告の集計が読めませんでした（準備中かもしれません）');
      data.stats = stats;
      data.nippou = nip && nip.ok && nip.days ? nip : null;
      data.month = stats.month;
      data.at = new Date();
      render();
    }).catch(function (e) {
      if (my !== gen) return;
      showState(false, '読み込めませんでした：' + e.message);
      $('kpis').hidden = true; $('mix').hidden = true; $('bar').hidden = true; $('tcard').hidden = true;
    }).then(function () {
      if (my !== gen) return;
      pendingMain = false;
      stamp();
      if (waiting === 0) { busy = false; $('reload').disabled = false; }
    });
  }

  function buildList() {
    var month = data.stats.month, byName = {};
    data.stats.rows.forEach(function (row) {
      if (row[0] !== month) return;
      (byName[row[1]] = byName[row[1]] || []).push({ carrier: row[2], label: row[3], count: Number(row[4]) || 0 });
    });
    var today = (data.nippou && data.nippou.today) || todayYmd();
    var out = PEOPLE.map(function (n, i) {
      var s = P.score(byName[n]);
      var nd = (data.nippou && data.nippou.days[n]) || [];
      return { name: n, i: i, partner: R.isPartner(n), s: s,
        nippouToday: nd.indexOf(today) >= 0, nippouDays: nd.length,
        nippouLast: (data.nippou && data.nippou.last[n]) || '' };
    });
    // 順位は戦闘力の降順で1回だけ決める（同点は名簿順）。並べ替えでは変わらない
    out.slice().sort(function (a, b) { return b.s.power - a.s.power || a.i - b.i; })
      .forEach(function (x, idx) { x.rank = idx + 1; });
    maxTotal = 1; maxPower = 1;
    out.forEach(function (x) { if (x.s.total > maxTotal) maxTotal = x.s.total; if (x.s.power > maxPower) maxPower = x.s.power; });
    return out;
  }

  /* ── 稼働費のセル（届いた人から入れ替えるので関数にしておく） ── */
  function usesCommute(name) { return COMMUTE.indexOf(name) >= 0; }
  function commuteDaysHtml(name) {
    if (!usesCommute(name)) return '<span class="dim">—</span>';
    var c = data.commute[name];
    if (!c) return '<span class="wait">…</span>';
    if (c.pending) return '<span class="dim">準備中</span>';
    if (c.error) return '<span class="err">読めません</span>';
    var h = '<span class="num big">' + c.days + '<small style="font-size:11px;font-weight:800;color:var(--t-mute)">日</small></span>';
    if (c.irregular) h += '<span class="small">' + (c.routes ? '経由地あり ' : 'イレギュラー ') + c.irregular + '件</span>';
    if (Number(c.month) !== Number(String(data.month).slice(5, 7))) h += '<span class="small">シートは' + Number(c.month) + '月</span>';
    return h;
  }
  function commuteAmtHtml(name) {
    if (!usesCommute(name)) return '<span class="dim">—</span>';
    var c = data.commute[name];
    if (!c) return '<span class="wait">…</span>';
    if (c.pending) return '<span class="dim">準備中</span>';
    if (c.error) return '<span class="err">読めません</span>';
    return '<span class="num big">¥' + fmt(c.amount) + '</span>';
  }
  function findRow(name) {
    var rows = $('rows').children;
    for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute('data-row') === name) return rows[i];
    return null;
  }
  function paintCommuteCells(name) {
    var row = findRow(name);
    if (!row) return;
    var d = row.querySelector('[data-c="cdays"]'), a = row.querySelector('[data-c="camt"]');
    if (d) d.innerHTML = commuteDaysHtml(name);
    if (a) a.innerHTML = commuteAmtHtml(name);
  }

  /* ── サマリー3枚 ── */
  function kpiGain() {
    var total = 0, pw = 0;
    list.forEach(function (x) { total += x.s.total; pw += x.s.power; });
    return '<div class="kpi hero"><div class="k">今月の獲得（全員）</div><div class="v num">' + fmt(total)
      + '<small>件</small></div><div class="s num">戦闘力 合計 ' + fmt(pw) + '</div></div>';
  }
  function kpiNippou() {
    if (!data.nippou) return '<div class="kpi"><div class="k">きょうの日報</div><div class="v">—</div><div class="s">準備中（Google 側の更新待ち）</div></div>';
    var need = NIPPOU.map(function (n) { return list.filter(function (x) { return x.name === n; })[0]; }).filter(Boolean);
    var yet = need.filter(function (x) { return !x.nippouToday; });
    return '<div class="kpi' + (yet.length ? ' alert' : '') + '"><div class="k">きょうの日報</div><div class="v num">'
      + (need.length - yet.length) + '<small>/ ' + need.length + '人</small></div><div class="s">'
      + (yet.length ? 'まだ：' + yet.map(function (x) { return esc(x.name); }).join('・') : '全員提出済み') + '</div></div>';
  }
  function kpiCommute() {
    var cm = COMMUTE.map(function (n) { return data.commute[n]; }).filter(function (c) { return c && !c.error && !c.pending; });
    var left = COMMUTE.filter(function (n) { return !data.commute[n]; }).length;
    return '<div class="kpi"><div class="k">稼働費の入力</div><div class="v num">'
      + cm.reduce(function (a, c) { return a + c.days; }, 0) + '<small>日分</small></div><div class="s num">'
      + cm.length + '人・合計 ¥' + fmt(cm.reduce(function (a, c) { return a + c.amount; }, 0))
      + (left ? '<span class="wait">（残り ' + left + '人）</span>' : '') + '</div></div>';
  }
  function paintCommuteKpi() {
    var cards = $('kpis').children;
    if (cards.length === 3) cards[2].outerHTML = kpiCommute();
  }

  /* ── 今月の内訳（区分ごとの積み上げ） ── */
  function renderMix() {
    var cats = P.CATS, sum = {}, all = 0;
    cats.forEach(function (k) { sum[k] = 0; });
    list.forEach(function (x) { cats.forEach(function (k) { sum[k] += x.s.cats[k] || 0; }); });
    cats.forEach(function (k) { all += sum[k]; });
    if (!all) { $('mix').hidden = true; return; }
    $('mix').hidden = false;
    $('mix-total').textContent = '合計 ' + fmt(all) + '件';
    $('stack').innerHTML = cats.filter(function (k) { return sum[k] > 0; }).map(function (k) {
      return '<i style="width:' + (sum[k] / all * 100).toFixed(2) + '%;background:var(' + CAT_VAR[k] + ')"></i>';
    }).join('');
    $('legend').innerHTML = cats.map(function (k) {
      return '<span class="lg"><span class="dot" style="background:var(' + CAT_VAR[k] + ')"></span>' + esc(k) + ' <b>' + fmt(sum[k]) + '</b></span>';
    }).join('');
  }

  /* ── 一覧 ── */
  function rowHtml(x) {
    var useN = NIPPOU.indexOf(x.name) >= 0;
    var nipToday = !useN ? '<span class="dim">—</span>'
      : !data.nippou ? '<span class="dim">準備中</span>'
      : x.nippouToday ? '<span class="tag ok">提出済み</span>' : '<span class="tag ng">未提出</span>';
    var nipMonth = !useN || !data.nippou ? '<span class="dim">—</span>'
      : '<span class="num big">' + x.nippouDays + '<small style="font-size:11px;font-weight:800;color:var(--t-mute)">日</small></span>'
        + (x.nippouLast ? '<span class="small">最後 ' + esc(x.nippouLast) + '</span>' : '');
    var rk = 'rk' + (x.rank <= 3 ? ' r' + x.rank : '');
    return '<tr data-row="' + esc(x.name) + '">'
      + '<td class="c-rank"><span class="' + rk + '">' + x.rank + '</span></td>'
      + '<td class="c-name"><span class="who"><span class="av ' + (x.partner ? 'partner' : 'staff') + '" aria-hidden="true">'
        + esc(x.name.slice(0, 1)) + '</span><span><b>' + esc(x.name) + '</b><small>'
        + (x.partner ? 'PARTNER' : 'STAFF') + '</small></span></span></td>'
      + '<td data-k="獲得" class="num">' + (x.s.total
          ? '<span class="big">' + x.s.total + '<small style="font-size:11px;font-weight:800;color:var(--t-mute)">件</small></span><span class="mini"><i style="width:' + pct(x.s.total, maxTotal) + '%"></i></span>'
          : '<span class="dim">0件</span>') + '</td>'
      + '<td data-k="戦闘力" class="num"><span class="pt">' + fmt(x.s.power) + '</span>'
        + (x.s.power ? '<span class="mini pw"><i style="width:' + pct(x.s.power, maxPower) + '%"></i></span>' : '') + '</td>'
      + '<td data-k="MNP" class="num">' + (x.s.cats['MNP'] ? '<span class="big">' + x.s.cats['MNP'] + '</span>' : '<span class="dim">0</span>') + '</td>'
      + '<td data-k="固定" class="num">' + (x.s.cats['固定'] ? '<span class="big">' + x.s.cats['固定'] + '</span>' : '<span class="dim">0</span>') + '</td>'
      + '<td data-k="日報（今日）">' + nipToday + '</td>'
      + '<td data-k="日報（今月）">' + nipMonth + '</td>'
      + '<td data-k="稼働費 入力" data-c="cdays">' + commuteDaysHtml(x.name) + '</td>'
      + '<td data-k="稼働費 金額" data-c="camt">' + commuteAmtHtml(x.name) + '</td>'
      + '</tr>';
  }

  function render() {
    list = buildList();
    var shown = list.slice();
    if (sortBy === 'power') shown.sort(function (a, b) { return b.s.power - a.s.power || a.i - b.i; });
    else shown.sort(function (a, b) { return a.i - b.i; });

    $('kpis').innerHTML = kpiGain() + kpiNippou() + kpiCommute();
    renderMix();
    $('rows').innerHTML = shown.map(rowHtml).join('');
    stamp();
    $('state').hidden = true; $('kpis').hidden = false; $('bar').hidden = false; $('tcard').hidden = false;
    renderMoney();
  }

  /* ── 経費・稼働費：1人1枚。開くと稼働費の内訳と日ごと、経費精算の項目ごとと明細 ── */
  var openNames = {};
  function linesHtml(lines) {
    if (!lines || !lines.length) return '<div class="mempty">まだ入力がありません。</div>';
    return '<div class="lines">' + lines.map(function (l) {
      return '<div class="lrow"><span class="d">' + esc(l.d) + '</span><span class="t">' + esc(l.t) + (l.sub ? '<small>' + esc(l.sub) + '</small>' : '') + '</span><span class="a">¥' + fmt(Math.round(l.a)) + '</span></div>';
    }).join('') + '</div>';
  }
  function renderMoney() {
    var curM = Number(String(data.month).slice(5, 7));
    var people = PEOPLE.filter(function (n) { return COMMUTE.indexOf(n) >= 0 || KEIHI.indexOf(n) >= 0; }).map(function (n, i) {
      var c = data.commute[n], k = data.keihi[n];
      var ca = c && !c.error && !c.pending ? c.amount : 0, ka = k && !k.error ? k.amount : 0;
      return { name: n, i: i, c: COMMUTE.indexOf(n) >= 0 ? c : undefined, k: KEIHI.indexOf(n) >= 0 ? k : undefined, ca: ca, ka: ka, total: ca + ka };
    }).sort(function (a, b) { return b.total - a.total || a.i - b.i; });
    var sc = 0, sk = 0, nc = 0, nk = 0;
    people.forEach(function (x) { sc += x.ca; sk += x.ka; if (x.ca) nc++; if (x.ka) nk++; });
    $('money-kpis').innerHTML =
      '<div class="kpi"><div class="k">稼働費（全員）</div><div class="v num">¥' + fmt(sc) + '</div><div class="s">' + nc + '人分</div></div>'
      + '<div class="kpi"><div class="k">経費精算（全員）</div><div class="v num">¥' + fmt(sk) + '</div><div class="s">' + nk + '人分</div></div>'
      + '<div class="kpi"><div class="k">合計</div><div class="v num">¥' + fmt(sc + sk) + '</div><div class="s">稼働費＋経費精算</div></div>';
    $('money').innerHTML = people.map(function (x) {
      var c = x.c, k = x.k, chips = '';
      if (c !== undefined) chips += !c ? '<span class="chip">稼働費 <b>…</b></span>' : c.pending ? '<span class="chip">稼働費 準備中</span>' : c.error ? '<span class="chip warn">稼働費 読めません</span>'
        : '<span class="chip c">稼働費 <b>¥' + fmt(c.amount) + '</b>' + c.days + '日</span>' + (Number(c.month) !== curM ? '<span class="chip warn">稼働費のシートは' + Number(c.month) + '月</span>' : '');
      if (k !== undefined) chips += !k ? '<span class="chip">経費 <b>…</b></span>' : k.error ? '<span class="chip warn">経費 読めません</span>'
        : '<span class="chip k">経費 <b>¥' + fmt(k.amount) + '</b>' + k.count + '件</span>' + (k.ym && k.ym.indexOf(curM + '月') < 0 ? '<span class="chip warn">経費のシートは' + esc(k.ym) + '</span>' : '');
      var cb = '', kb = '';
      if (c !== undefined) {
        cb = '<div class="mblock"><h3>稼働費<span>' + (c && !c.error && !c.pending ? '¥' + fmt(c.amount) + '・' + c.days + '日' + (c.km ? '・' + c.km + 'km' : '') : '') + '</span></h3>';
        if (!c) cb += '<div class="mempty">読み込み中…</div>';
        else if (c.pending) cb += '<div class="mempty">準備中です。</div>';
        else if (c.error) cb += '<div class="mempty">読めませんでした：' + esc(c.error) + '</div>';
        else {
          cb += '<div class="parts">' + c.parts.filter(function (pp) { return pp[1]; }).map(function (pp) { return '<span class="chip">' + esc(pp[0]) + ' <b>¥' + fmt(pp[1]) + '</b></span>'; }).join('') + '</div>';
          cb += linesHtml(c.lines);
          if (c.files) cb += '<div class="src">添付：領収書 ' + c.files.receipts + '枚・ETCの利用明細 ' + c.files.etc + '件（経費精算/パートナー のフォルダ）</div>';
        }
        cb += '</div>';
      }
      if (k !== undefined) {
        kb = '<div class="mblock"><h3>経費精算<span>' + (k && !k.error ? '¥' + fmt(k.amount) + '・' + k.count + '件' + (k.ym ? '・' + esc(k.ym) : '') : '') + '</span></h3>';
        if (!k) kb += '<div class="mempty">読み込み中…</div>';
        else if (k.error) kb += '<div class="mempty">読めませんでした：' + esc(k.error) + '</div>';
        else {
          var top = k.items.length ? k.items[0][1] : 1;
          kb += k.items.length ? '<div class="bars">' + k.items.map(function (it) {
            return '<div class="brow"><span class="bl">' + esc(it[0]) + '</span><span class="bb"><i style="width:' + Math.max(3, Math.round(it[1] / top * 100)) + '%"></i></span><span class="bv">¥' + fmt(it[1]) + '</span></div>';
          }).join('') + '</div>' : '';
          kb += linesHtml(k.lines);
        }
        kb += '</div>';
      }
      return '<details class="mcard" data-name="' + esc(x.name) + '"' + (openNames[x.name] ? ' open' : '') + '><summary>'
        + '<div class="mn"><span class="av ' + (R.isPartner(x.name) ? 'partner' : 'staff') + '" aria-hidden="true">' + esc(x.name.slice(0, 1)) + '</span>'
        + '<span><b>' + esc(x.name) + '</b><small>' + (R.isPartner(x.name) ? 'PARTNER' : 'STAFF') + '</small></span></div>'
        + '<div class="mt num">¥' + fmt(x.total) + '</div><div class="mv">' + chips + '</div></summary>'
        + '<div class="mbody"' + (c === undefined || k === undefined ? ' style="grid-template-columns:1fr"' : '') + '>' + cb + kb + '</div></details>';
    }).join('');
    $('money-wrap').hidden = !people.length;
  }
  $('money').addEventListener('toggle', function (e) {
    var d = e.target; if (d.classList && d.classList.contains('mcard')) openNames[d.dataset.name] = d.open;
  }, true);
  $('open-all').addEventListener('click', function () {
    var cards = document.querySelectorAll('.mcard'), anyClosed = Array.prototype.some.call(cards, function (d) { return !d.open; });
    Array.prototype.forEach.call(cards, function (d) { d.open = anyClosed; openNames[d.dataset.name] = anyClosed; });
    this.textContent = anyClosed ? 'すべて閉じる' : 'すべて開く';
  });

  document.querySelectorAll('[data-sort]').forEach(function (b) {
    b.addEventListener('click', function () {
      sortBy = b.dataset.sort;
      document.querySelectorAll('[data-sort]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      if (data && data.stats) render();
    });
  });
  $('reload').addEventListener('click', function () { if (!busy) load(); });
  load();
})();
</script>
</body>
</html>
