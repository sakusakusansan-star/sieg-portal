<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>シフト入力｜Sieg 業務ポータル</title>
<meta name="description" content="スマホからシフトを送信して、シフト表に直接書き込むページ。">
<meta name="theme-color" content="#EFF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1015" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="sieg-theme.css">
<link rel="stylesheet" href="docs/docs.css">
<style>
  /* ═══ このページ専用（配色・土台は docs.css と共通） ═══ */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-head {
    font-size: 12px;
    font-weight: 800;
    color: var(--amber2);
    letter-spacing: .5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-head .req {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted2);
    font-weight: 700;
  }

  /* 名前 */
  .whoami {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .whoami-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .whoami-name { font-size: 19px; font-weight: 900; flex: 1; letter-spacing: 1px; }
  .whoami-name.unset { color: var(--muted2); font-size: 15px; font-weight: 700; }

  /* ボタン共通 */
  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 13px;
    cursor: pointer;
  }
  .btn:active { background: var(--amber); color: var(--ink); border-color: var(--amber); }
  .btn.small { font-size: 11px; padding: 6px 10px; border-radius: 7px; }
  .btn.ghost { color: var(--muted); }

  /* 選択チップ */
  .pick { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 13px;
    cursor: pointer;
  }
  .pick button.on {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--ink);
  }

  /* 入力欄 */
  .input {
    width: 100%;
    font-family: inherit;
    font-size: 16px; /* iOSで自動ズームさせない */
    color: var(--text);
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 12px;
    margin-top: 8px;
  }
  .input::placeholder { color: var(--muted2); }
  .input:focus { outline: none; border-color: var(--amber); }

  /* 月切り替え */
  /* カレンダー上部の月（入力できる月が複数あるときだけ ‹ › で切り替える） */
  .cal-month { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-title { flex: 1; text-align: center; }
  .cal-title b { font-size: 17px; font-weight: 900; }
  .cal-title span { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .cal-nav { min-width: 44px; min-height: 40px; font-size: 18px; line-height: 1; }
  .cal-nav[hidden] { display: inline-block !important; visibility: hidden; }

  /* カレンダー */
  .cal-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .cal-dow, .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-dow { margin-bottom: 5px; }
  .cal-dow div {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted2);
    letter-spacing: 1px;
  }
  .cal-dow .sun { color: var(--sg-red-tint); }
  .cal-dow .sat { color: var(--sg-sat); }
  .cal-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
    padding: 0;
  }
  .cal-cell.blank { background: none; border: none; cursor: default; }
  .cal-cell.sun { color: var(--sg-sun); }
  .cal-cell.sat { color: var(--sg-sat); }
  .cal-cell .mark {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--green);
  }
  .cal-cell .mark.hold { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .cal-cell.on {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--ink);
  }
  .cal-cell.on .mark { background: var(--ink); box-shadow: none; }
  .cal-cell.on.del {
    background: var(--red);
    border-color: var(--red);
  }
  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .cal-legend i {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
  }

  /* 登録済みの内容 */
  .day-list { display: flex; flex-direction: column; gap: 6px; }
  .day-row {
    display: grid;
    grid-template-columns: 46px 1fr;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .day-row .d {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 800;
    color: var(--amber2);
  }
  .day-row .t { color: var(--muted); line-height: 1.5; }
  .day-row .t b { color: var(--text); font-weight: 700; }
  .day-row .t b.hold { color: var(--red); }
  .empty-note { font-size: 12px; color: var(--muted2); }

  /* 送信バー */
  .send-bar {
    position: sticky;
    bottom: 0;
    margin: 18px -14px 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent 0%, var(--sg-bg) 30%);
  }
  .send {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--amber);
    border: none;
    border-radius: 11px;
    padding: 15px;
    cursor: pointer;
    box-shadow: none;
  }
  .send:disabled { background: var(--sg-hair); color: var(--muted2); box-shadow: none; cursor: default; }
  .send.del { background: var(--red); color: #fff; box-shadow: none; }
  .send-sub { text-align: center; font-size: 11px; color: var(--muted2); margin-top: 8px; line-height: 1.6; }

  /* モード切替 */
  .modes { display: flex; gap: 7px; margin-bottom: 12px; }
  .modes button { flex: 1; }
  .modes button.on { background: var(--amber); border-color: var(--amber); color: var(--ink); }
  .modes button.on.del { background: var(--red); border-color: var(--red); color: #fff; }

  /* 通知 */
  .msg {
    font-size: 12px;
    line-height: 1.65;
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: var(--sg-green-tint); border-left: 3px solid var(--green); color: var(--green); font-weight: 700; }
  .msg.err { background: var(--sg-red-tint); border-left: 3px solid var(--red); }
  .msg.err b { color: var(--red); }
  .msg.info { background: var(--sg-amber-tint); border-left: 3px solid var(--amber); }

  /* 確認オーバーレイ */
  /* 高さはJSで実寸を入れる（アドレスバーの出入りでズレないように） */
  .ov {
    position: fixed; left: 0; top: 0;
    width: 100%; height: 100%;
    background: var(--sg-scrim);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .ov.show { display: flex; }
  .ov-box {
    width: 100%;
    max-width: 380px;
    max-height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .ov-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .ov-lede { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .ov-warn {
    background: var(--sg-red-tint);
    border-left: 3px solid var(--red);
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 12px;
    line-height: 1.7;
  }
  .ov-warn b { display: block; color: var(--red); margin-bottom: 4px; }
  .ov-warn span { display: block; }
  .ov-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .ov-item {
    font-size: 12px;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    line-height: 1.6;
  }
  .ov-item b { font-family: var(--sg-font); font-variant-numeric: tabular-nums; color: var(--amber2); font-size: 13px; }
  .ov-acts { display: flex; gap: 8px; }
  .ov-acts button { flex: 1; padding: 12px; font-size: 14px; font-weight: 800; }
  .ov-acts .go { background: var(--amber); border-color: var(--amber); color: var(--ink); }
  .ov-acts .go.del { background: var(--red); border-color: var(--red); color: #fff; }
  .ov-names { display: flex; flex-direction: column; gap: 8px; }
  .ov-names button { width: 100%; padding: 14px; font-size: 16px; font-weight: 800; letter-spacing: 2px; }

  /* ═══ 共通の見た目（sieg-theme.css）に合わせる ═══ */
  .card, .whoami { border-radius: var(--sg-r); box-shadow: var(--sg-lift); padding: 16px; }
  .card-head { color: var(--sg-ink); font-size: 13px; }
  .ov-box { background: var(--sg-surface); border-radius: var(--sg-r); }
  .btn, .pick button, .input, .cal-cell { border-radius: var(--sg-r-sm); }
  .day-row .d { color: var(--sg-ink); }
  .ov-item b { color: var(--sg-ink); }
  .send { border-radius: var(--sg-r-sm); }
  .send:disabled { background: var(--sg-hair); color: var(--sg-faint); }
</style>
</head>
<body>
<div class="wrap">

  <div data-sieg-back="dark"></div>

  <div class="page-head">
    <div class="eyebrow">Sieg 業務ポータル</div>
    <h1>シフト入力</h1>
    <div class="lede">選んで押すだけ。シフト表に直接書き込まれます。</div>
  </div>

  <div class="msg" id="msg"></div>

  <!-- 名前 -->
  <div class="whoami">
    <div>
      <div class="whoami-label">あなた</div>
      <div class="whoami-name unset" id="who-name">未設定</div>
    </div>
    <button class="btn small" type="button" id="who-change">選択</button>
  </div>

  <!-- モード -->
  <div class="modes">
    <button class="btn on" type="button" data-mode="submit">シフトを入れる</button>
    <button class="btn" type="button" data-mode="delete">取り消す</button>
  </div>

  <!-- カレンダー -->
  <div class="card">
    <div class="card-head"><span id="cal-step">1. 日にちをえらぶ</span><span class="req" id="picked-count">0日</span></div>
    <div class="cal-month">
      <button class="btn small cal-nav" type="button" id="m-prev" aria-label="前の月">‹</button>
      <div class="cal-title"><b id="cal-title"></b><span id="cal-sub"></span></div>
      <button class="btn small cal-nav" type="button" id="m-next" aria-label="次の月">›</button>
    </div>
    <div class="cal-tools">
      <button class="btn small" type="button" data-sel="all">全部</button>
      <button class="btn small" type="button" data-sel="weekday">平日</button>
      <button class="btn small" type="button" data-sel="weekend">土日</button>
      <button class="btn small ghost" type="button" data-sel="clear">クリア</button>
    </div>
    <div class="cal-dow">
      <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
    </div>
    <div class="cal-grid" id="cal"></div>
    <div class="cal-legend">
      <span><i style="background:var(--amber);"></i>選択中</span>
      <span><i style="background:var(--green);"></i>登録済み</span>
      <span><i style="background:var(--red);"></i>希望休・店休日など</span>
    </div>
  </div>

  <!-- 稼働内容 -->
  <div class="card" id="detail-card">
    <div class="card-head"><span>2. 稼働の内容</span><span class="req">必須</span></div>

    <div class="guide-note" style="margin:0 0 6px;">取引先</div>
    <div class="pick" id="clients"></div>

    <div class="guide-note" style="margin:12px 0 6px;">キャリア／店舗</div>
    <div class="pick" id="carriers"></div>

    <div class="guide-note" style="margin:12px 0 6px;">開催場所</div>
    <div class="pick" id="places"></div>
    <input class="input" id="place-input" type="text" placeholder="ほかの場所はここに入力" autocomplete="off">

    <div class="guide-note" style="margin:12px 0 6px;">ホテル（泊まりのときだけ）</div>
    <input class="input" id="hotel-input" type="text" placeholder="未入力でOK" autocomplete="off" style="margin-top:0;">
  </div>

  <!-- 登録済み -->
  <div class="card">
    <div class="card-head"><span>登録済みのシフト</span><button class="btn small ghost" type="button" id="reload">再読込</button></div>
    <div class="day-list" id="day-list"></div>
  </div>

  <div class="send-bar">
    <button class="send" type="button" id="send" disabled>送信する</button>
    <div class="send-sub" id="send-sub">名前・内容・日にちを選ぶと送信できます</div>
  </div>

  <div class="foot">
    送信するとシフト表に直接書き込まれ、送信ログにも残ります。<br>
    間違えたときは「取り消す」で消してから入れ直してください。
  </div>

</div>

<!-- 確認 / 名前選択 -->
<div class="ov" id="ov">
  <div class="ov-box">
    <div class="ov-title" id="ov-title">送信内容の確認</div>
    <div class="ov-lede" id="ov-lede"></div>
    <div class="ov-warn" id="ov-warn" style="display:none;"></div>
    <div class="ov-list" id="ov-list"></div>
    <div class="ov-names" id="ov-names" style="display:none;"></div>
    <div class="ov-acts" id="ov-acts">
      <button class="btn" type="button" id="ov-cancel">やめる</button>
      <button class="btn go" type="button" id="ov-go">送信する</button>
    </div>
  </div>
</div>

<script src="gas-client.js"></script>
<script src="sieg-nav.js"></script>
<script>
  /* ═══════════════════════════════════════════════════════════
     設定：Google Apps Script のデプロイURLをここに貼る
     （gas/shift-api.gs を貼り付けてデプロイ → /exec のURL）
     ═══════════════════════════════════════════════════════════ */
  var SHIFT_API   = 'https://script.google.com/macros/s/AKfycbz_aHJ4v0Q-s5_m_i7G7gomrJeicz_iRWPF1qcafrG16gQtTV8VA7dU2ViTNgcbtTgYTg/exec';
  var SHIFT_TOKEN = 'sieg-shift-2026';   // GAS側の TOKEN と同じ文字列

  var STAFF    = ['福岡', '清田', '福山', '古川'];
  var CLIENTS  = ['南国殖産', 'ハイコム', 'サンコミ', 'ダル'];
  var CARRIERS = ['docomo', 'SoftBank', 'au'];
  // 開催場所のボタンは3つだけ。近見・下通は固定で、3つ目はよく選ぶ場所に入れ替わる
  // （この端末で送った回数＋その月にもう登録されている回数で決める）。それ以外は入力欄に書く。
  var PLACES_FIXED = ['近見', '下通'];
  var PLACE_FALLBACK = '健軍';   // まだ何も送っていないときの3つ目
  var PLACE_COUNT_KEY = 'siegShiftPlaceCount';

  // 取引先を選んだときに、いつもの組み合わせを自動で入れる。
  // 場所が毎回変わる取引先は、キャリアだけ入れて場所は選んでもらう。
  var PRESET = {
    '南国殖産': { carrier: 'docomo',   place: '近見' },
    'ハイコム': { carrier: 'SoftBank' },
    'サンコミ': { carrier: 'au' },
    'ダル':     { carrier: 'docomo' }
  };
  var STAFF_KEY = 'siegStaff';   // ポータル本体と共通（名前を1回選べば使い回せる）
  var LAST_KEY  = 'siegShiftLast';

  var DOW = ['日', '月', '火', '水', '木', '金', '土'];

  var state = {
    name: '',
    year: 0,
    month: 0,
    mode: 'submit',
    client: '', carrier: '', place: '', hotel: '',
    picked: {},      // 日 → true
    existing: {},    // 日 → {client, carrier, place, hotel}
    busy: false
  };

  function $(id) { return document.getElementById(id); }

  /* 覆いの高さに、いま実際に見えている高さを入れる */
  function ovFit() {
    var vv = window.visualViewport;
    var ov = $('ov');
    ov.style.height = (vv ? vv.height : window.innerHeight) + 'px';
    ov.style.top = (vv ? vv.offsetTop : 0) + 'px';
  }
  function openOv() {
    ovFit();
    $('ov').classList.add('show');
    var box = document.querySelector('.ov-box');
    if (box) box.scrollTop = 0;
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
  }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function apiReady() { return SHIFT_API.indexOf('http') === 0; }

  function showMsg(kind, html) {
    var el = $('msg');
    el.className = 'msg show ' + kind;
    el.innerHTML = html;
  }
  function hideMsg() { $('msg').className = 'msg'; }

  /* ═══ 名前 ═══ */
  function initName() {
    var q = new URLSearchParams(location.search).get('staff');
    var name = (q && STAFF.indexOf(q) >= 0) ? q : lsGet(STAFF_KEY);
    if (name && STAFF.indexOf(name) >= 0) setName(name, true);
    else openNamePicker();
  }

  function setName(name, quiet) {
    state.name = name;
    lsSet(STAFF_KEY, name);
    $('who-name').textContent = name;
    $('who-name').classList.remove('unset');
    $('who-change').textContent = '変更';
    if (!quiet) hideMsg();
    loadExisting();
    syncSend();
  }

  function openNamePicker() {
    $('ov-title').textContent = 'あなたの名前をえらんでください';
    $('ov-lede').textContent = '一度えらぶと次回から覚えています。';
    $('ov-list').style.display = 'none';
    $('ov-acts').style.display = 'none';
    var box = $('ov-names');
    box.style.display = 'flex';
    box.innerHTML = '';
    STAFF.forEach(function(n) {
      var b = document.createElement('button');
      b.className = 'btn';
      b.type = 'button';
      b.textContent = n;
      b.addEventListener('click', function() { setName(n); closeOv(); });
      box.appendChild(b);
    });
    openOv();
  }

  function closeOv() {
    $('ov').classList.remove('show');
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }

  /* ═══ 月 ═══ */

  /**
   * 入力できる月は、シフト表のシートがある月。
   * シートを1枚作れば、その月がここに出てくる。
   * 取れなかったときだけ、今月と来月を出しておく。
   */
  function initMonths() {
    if (!apiReady()) return buildMonths(defaultMonths());
    GasClient.get(SHIFT_API, { action: 'months', token: SHIFT_TOKEN })
      .then(function(data) {
        if (!data || !data.ok || !data.months || !data.months.length) throw new Error('月が取れません');
        buildMonths(upcoming(data.months));
      })
      .catch(function() { buildMonths(defaultMonths()); });
  }

  function defaultMonths() {
    var now = new Date();
    return [0, 1].map(function(i) {
      var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      return { year: d.getFullYear(), month: d.getMonth() + 1 };
    });
  }

  /** 今月以降のシートだけを残す。過去の月しか無ければ、その一番新しい月を出す。 */
  function upcoming(months) {
    var now = new Date();
    var from = now.getFullYear() * 12 + now.getMonth();
    var list = months.filter(function(m) { return (m.year * 12 + m.month - 1) >= from; });
    return list.length ? list : months.slice(-1);
  }

  var monthList = [];   // 入力できる月（古い順）

  function buildMonths(months) {
    monthList = months;
    // 用意されている一番新しい月＝いま集めている月。それを開いておく。
    var last = months[months.length - 1];
    setMonth(last.year, last.month);
  }

  function monthIndex() {
    for (var i = 0; i < monthList.length; i++) {
      if (monthList[i].year === state.year && monthList[i].month === state.month) return i;
    }
    return -1;
  }

  /* カレンダー上部の「2026年11月（来月）」と ‹ ›。月が1つしか無ければ矢印は出さない */
  function renderMonthNav() {
    var now = new Date();
    var diff = (state.year * 12 + state.month - 1) - (now.getFullYear() * 12 + now.getMonth());
    $('cal-title').textContent = state.year + '年' + state.month + '月';
    $('cal-sub').textContent = diff === 0 ? '今月' : diff === 1 ? '来月' : diff === 2 ? '再来月' : '';
    var i = monthIndex();
    $('m-prev').hidden = !(i > 0);
    $('m-next').hidden = !(i >= 0 && i < monthList.length - 1);
  }

  function stepMonth(delta) {
    var m = monthList[monthIndex() + delta];
    if (m) setMonth(m.year, m.month);
  }

  function setMonth(y, m) {
    state.year = y;
    state.month = m;
    state.picked = {};
    state.existing = {};
    renderMonthNav();
    renderCal();
    renderDayList();
    loadExisting();
    syncSend();
  }

  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

  /* ═══ 選択チップ ═══ */
  function renderPick(boxId, values, key, freeInputId, after) {
    var box = $(boxId);
    box.innerHTML = '';
    values.forEach(function(v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = v;
      b.classList.toggle('on', state[key] === v);
      b.addEventListener('click', function() {
        state[key] = (state[key] === v) ? '' : v;
        if (freeInputId) $(freeInputId).value = state[key];
        if (after) after(state[key]);
        renderChoices();
        syncSend();
      });
      box.appendChild(b);
    });
  }

  // 取引先を選んだら、キャリアと場所を埋めておく。
  // そのあと手で選び直せるので、違う日はそこだけ直せばよい。
  function applyPreset(client) {
    var preset = PRESET[client] || {};
    if (preset.carrier) state.carrier = preset.carrier;

    if (preset.place) {
      state.place = preset.place;
    } else if (isPresetPlace(state.place)) {
      // 前の取引先で自動で入った場所が残らないように消す。
      // 手で入れた場所は消さない。
      state.place = '';
    } else {
      return;
    }
    $('place-input').value = state.place;
  }

  function isPresetPlace(place) {
    if (!place) return false;
    return Object.keys(PRESET).some(function(c) { return PRESET[c].place === place; });
  }

  function placeCounts() {
    var counts = {};
    try { counts = JSON.parse(lsGet(PLACE_COUNT_KEY) || '{}') || {}; } catch (e) { counts = {}; }
    return counts;
  }

  function countPlace(place) {
    if (!place || PLACES_FIXED.indexOf(place) >= 0) return;
    var counts = placeCounts();
    counts[place] = (counts[place] || 0) + 1;
    lsSet(PLACE_COUNT_KEY, JSON.stringify(counts));
  }

  /** 3つ目のボタン：よく選ぶ場所（近見・下通以外）。希望休など稼働でない記載は数えない */
  function favoritePlace() {
    var score = {};
    var counts = placeCounts();
    Object.keys(counts).forEach(function(p) { score[p] = (score[p] || 0) + counts[p]; });
    Object.keys(state.existing).forEach(function(d) {
      var e = state.existing[d];
      if (e && e.client && e.place) score[e.place] = (score[e.place] || 0) + 1;
    });
    var best = '', bestScore = 0;
    Object.keys(score).forEach(function(p) {
      if (PLACES_FIXED.indexOf(p) >= 0) return;
      if (score[p] > bestScore) { best = p; bestScore = score[p]; }
    });
    return best || PLACE_FALLBACK;
  }

  function placeCandidates() {
    return PLACES_FIXED.concat([favoritePlace()]);
  }

  function renderChoices() {
    renderPick('clients', CLIENTS, 'client', null, applyPreset);
    renderPick('carriers', CARRIERS, 'carrier');
    renderPick('places', placeCandidates(), 'place', 'place-input');
  }

  /* ═══ カレンダー ═══ */
  function renderCal() {
    var cal = $('cal');
    cal.innerHTML = '';
    if (!state.year) return;
    var first = new Date(state.year, state.month - 1, 1).getDay();
    var total = daysInMonth(state.year, state.month);

    for (var i = 0; i < first; i++) {
      var blank = document.createElement('div');
      blank.className = 'cal-cell blank';
      cal.appendChild(blank);
    }
    for (var d = 1; d <= total; d++) {
      (function(day) {
        var dow = new Date(state.year, state.month - 1, day).getDay();
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cal-cell' + (dow === 0 ? ' sun' : dow === 6 ? ' sat' : '') +
          (state.picked[day] ? ' on' : '') + (state.mode === 'delete' ? ' del' : '');
        var num = document.createElement('span');
        num.textContent = day;
        b.appendChild(num);
        var entry = state.existing[day];
        if (entry) {
          var mark = document.createElement('span');
          mark.className = 'mark' + (isHold(entry) ? ' hold' : '');
          b.appendChild(mark);
        }
        b.addEventListener('click', function() {
          if (state.picked[day]) delete state.picked[day];
          else state.picked[day] = true;
          renderCal();
          syncSend();
        });
        cal.appendChild(b);
      })(d);
    }
    $('picked-count').textContent = pickedDays().length + '日';
  }

  /**
   * 「希望休」「店休日」「打ち合わせ」など、稼働ではない記載かどうか。
   * 取引先が入っていないのに場所だけ書かれている日をそう見なす。
   * 送信するとこれが消えてしまうので、確認画面で知らせる。
   */
  function isHold(entry) {
    return !!entry && !entry.client && !!(entry.place || entry.hotel);
  }

  function holdDays(days) {
    return days.filter(function(d) { return isHold(state.existing[d]); });
  }

  function pickedDays() {
    return Object.keys(state.picked).map(Number).sort(function(a, b) { return a - b; });
  }

  /* 選んだ日を、連続しているかたまり（開始日〜終了日）にまとめる */
  function toRanges(days) {
    var out = [];
    days.forEach(function(d) {
      var last = out[out.length - 1];
      if (last && d === last.end + 1) last.end = d;
      else out.push({ start: d, end: d });
    });
    return out;
  }

  function quickSelect(kind) {
    state.picked = {};
    if (kind !== 'clear') {
      var total = daysInMonth(state.year, state.month);
      for (var d = 1; d <= total; d++) {
        var dow = new Date(state.year, state.month - 1, d).getDay();
        var weekend = (dow === 0 || dow === 6);
        if (kind === 'all' || (kind === 'weekday' && !weekend) || (kind === 'weekend' && weekend)) {
          state.picked[d] = true;
        }
      }
    }
    renderCal();
    syncSend();
  }

  /* ═══ 登録済みの読み込み ═══ */
  function loadExisting() {
    if (!apiReady() || !state.name || !state.year) return;
    $('day-list').innerHTML = '<div class="empty-note">読み込み中…</div>';
    GasClient.get(SHIFT_API, { action: 'list', token: SHIFT_TOKEN, name: state.name, year: state.year, month: state.month })
      .then(function(data) {
        if (!data || !data.ok) throw new Error((data && data.error) || '読み込みに失敗しました');
        state.existing = data.days || {};
        renderCal();
        renderDayList();
        renderChoices();
      })
      .catch(function(err) {
        state.existing = {};
        renderCal();
        $('day-list').innerHTML = '<div class="empty-note">登録済みの表示を取得できませんでした（' +
          escapeHtml(err.message) + '）。送信はできます。</div>';
      });
  }

  function renderDayList() {
    var box = $('day-list');
    var days = Object.keys(state.existing).map(Number).sort(function(a, b) { return a - b; });
    if (!days.length) {
      box.innerHTML = '<div class="empty-note">' +
        (state.name ? 'この月の登録はまだありません。' : '名前をえらぶと表示されます。') + '</div>';
      return;
    }
    box.innerHTML = '';
    days.forEach(function(d) {
      var e = state.existing[d];
      var dow = DOW[new Date(state.year, state.month - 1, d).getDay()];
      var row = document.createElement('div');
      row.className = 'day-row';
      var left = document.createElement('div');
      left.className = 'd';
      left.textContent = d + '(' + dow + ')';
      var right = document.createElement('div');
      right.className = 't';
      var parts = [];
      if (e.place) {
        parts.push(isHold(e)
          ? '<b class="hold">' + escapeHtml(e.place) + '</b>'
          : '<b>' + escapeHtml(e.place) + '</b>');
      }
      if (e.client) parts.push(escapeHtml(e.client));
      if (e.carrier) parts.push(escapeHtml(e.carrier));
      if (e.hotel) parts.push('🏨' + escapeHtml(e.hotel));
      right.innerHTML = parts.join('　') || '—';
      row.appendChild(left);
      row.appendChild(right);
      box.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ═══ 送信できる状態か ═══ */
  function syncSend() {
    state.place = $('place-input').value.trim();
    state.hotel = $('hotel-input').value.trim();

    var days = pickedDays();
    var ok, why;
    if (!apiReady()) {
      ok = false; why = '送信先が未設定です（gas/README.md の手順で設定してください）';
    } else if (!state.name) {
      ok = false; why = '名前をえらんでください';
    } else if (!days.length) {
      ok = false; why = '日にちをえらんでください';
    } else if (state.mode === 'submit' && (!state.client || !state.carrier || !state.place)) {
      ok = false; why = '取引先・キャリア・開催場所を入れてください';
    } else {
      ok = true;
      why = state.mode === 'delete'
        ? days.length + '日分を取り消します'
        : days.length + '日分（' + toRanges(days).length + '件）を送信します';
    }

    var btn = $('send');
    btn.disabled = !ok || state.busy;
    btn.textContent = state.busy ? '送信中…' : (state.mode === 'delete' ? '取り消す' : '送信する');
    btn.classList.toggle('del', state.mode === 'delete');
    $('send-sub').textContent = why;
  }

  /* ═══ モード切替 ═══ */
  function setMode(mode) {
    state.mode = mode;
    Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function(b) {
      var on = b.getAttribute('data-mode') === mode;
      b.classList.toggle('on', on);
      b.classList.toggle('del', on && mode === 'delete');
    });
    $('detail-card').style.display = (mode === 'delete') ? 'none' : '';
    $('cal-step').textContent = (mode === 'delete')
      ? '1. 取り消す日にちをえらぶ'
      : '1. 日にちをえらぶ';
    renderCal();
    syncSend();
  }

  /* ═══ 確認 → 送信 ═══ */
  function openConfirm() {
    var days = pickedDays();
    var ranges = toRanges(days);
    var del = state.mode === 'delete';

    $('ov-title').textContent = del ? '取り消しの確認' : '送信内容の確認';
    $('ov-lede').textContent = state.name + 'さん／' + state.year + '年' + state.month + '月';
    $('ov-names').style.display = 'none';
    $('ov-acts').style.display = 'flex';

    var holds = holdDays(days);
    var warn = $('ov-warn');
    if (holds.length) {
      warn.innerHTML = '<b>' + (del ? 'この日の記載も消えます' : 'この日は上書きされます') + '</b>' +
        holds.map(function(d) {
          var e = state.existing[d];
          return '<span>' + d + '日：' + escapeHtml(e.place || e.hotel) + '</span>';
        }).join('');
      warn.style.display = 'block';
    } else {
      warn.style.display = 'none';
    }

    var list = $('ov-list');
    list.style.display = 'flex';
    list.innerHTML = '';
    ranges.forEach(function(r) {
      var item = document.createElement('div');
      item.className = 'ov-item';
      var label = r.start === r.end ? r.start + '日' : r.start + '日〜' + r.end + '日';
      item.innerHTML = '<b>' + label + '</b>' + (del ? '　を取り消し' :
        '<br>' + escapeHtml(state.place) + '　' + escapeHtml(state.client) + '／' + escapeHtml(state.carrier) +
        (state.hotel ? '<br>ホテル：' + escapeHtml(state.hotel) : ''));
      list.appendChild(item);
    });
    var go = $('ov-go');
    go.textContent = del ? '取り消す' : '送信する';
    go.classList.toggle('del', del);
    openOv();
  }

  function send() {
    var days = pickedDays();
    var del = state.mode === 'delete';
    var payload = {
      token: SHIFT_TOKEN,
      // 自動でやり直したときに、GAS側で同じ送信と分かるようにする（送信ログの二重記録を防ぐ）
      requestId: GasClient.newId(),
      action: del ? 'delete' : 'submit',
      name: state.name,
      year: state.year,
      month: state.month,
      entries: toRanges(days).map(function(r) {
        return {
          start: r.start,
          end: r.end,
          client: del ? '' : state.client,
          carrier: del ? '' : state.carrier,
          place: del ? '' : state.place,
          hotel: del ? '' : state.hotel
        };
      })
    };

    state.busy = true;
    syncSend();
    hideMsg();

    // その日のセルを上書き／空にするだけなので、Google側の一時的な失敗は自動でやり直す
    GasClient.post(SHIFT_API, payload, { retry: true })
      .then(function(data) {
        if (!data || !data.ok) throw new Error((data && data.error) || '送信できませんでした');
        state.picked = {};
        lsSet(LAST_KEY, JSON.stringify({ client: state.client, carrier: state.carrier, place: state.place }));
        if (!del) countPlace(state.place);
        var extra = '';
        if (data.skipped && data.skipped.length) {
          extra += '<br>この月に無い日は飛ばしました：' + data.skipped.join('・') + '日';
        }
        if (data.logError) extra += '<br>（送信ログへの記録だけ失敗：' + escapeHtml(data.logError) + '）';
        showMsg('ok', (del ? '取り消しました' : '送信しました') + '（' + data.days + '日分）' + extra);
        loadExisting();
        renderCal();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function(err) {
        showMsg('err', '<b>送信できませんでした。</b><br>' + escapeHtml(err.message) +
          '<br>電波の良いところでもう一度お試しください。');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .then(function() {
        state.busy = false;
        syncSend();
      });
  }

  /* ═══ 起動 ═══ */
  (function init() {
    if (!apiReady()) {
      showMsg('info', '<b>まだ送信先が設定されていません。</b><br>' +
        'リポジトリの <code>gas/README.md</code> の手順でGASをデプロイし、' +
        'このページの <code>SHIFT_API</code> にURLを貼ってください。');
    }

    $('who-change').addEventListener('click', openNamePicker);
    $('m-prev').addEventListener('click', function() { stepMonth(-1); });
    $('m-next').addEventListener('click', function() { stepMonth(1); });
    $('reload').addEventListener('click', loadExisting);
    $('ov-cancel').addEventListener('click', closeOv);
    $('ov-go').addEventListener('click', function() { closeOv(); send(); });
    $('ov').addEventListener('click', function(e) { if (e.target === $('ov')) closeOv(); });
    var refit = function() { if ($('ov').classList.contains('show')) ovFit(); };
    window.addEventListener('resize', refit);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', refit);
      window.visualViewport.addEventListener('scroll', refit);
    }
    $('send').addEventListener('click', openConfirm);

    Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function(b) {
      b.addEventListener('click', function() { setMode(b.getAttribute('data-mode')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sel]'), function(b) {
      b.addEventListener('click', function() { quickSelect(b.getAttribute('data-sel')); });
    });
    $('place-input').addEventListener('input', function() {
      state.place = $('place-input').value.trim();
      renderPick('places', placeCandidates(), 'place', 'place-input');
      syncSend();
    });
    $('hotel-input').addEventListener('input', syncSend);

    // 前回の取引先・キャリア・場所を復元（毎月ほぼ同じなので入力を減らす）
    try {
      var last = JSON.parse(lsGet(LAST_KEY) || '{}');
      state.client = last.client || '';
      state.carrier = last.carrier || '';
      state.place = last.place || '';
      $('place-input').value = state.place;
    } catch (e) {}

    initMonths();
    renderChoices();
    initName();
    syncSend();
  })();
</script>
</body>
</html>
