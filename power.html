<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>戦闘力｜Sieg 業務ポータル</title>
<meta name="description" content="獲得報告から計算した今月の戦闘力とランキング。">
<meta name="theme-color" content="#0B0E1A">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Google（GAS）への接続を先に始めておく -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<!-- 数字・見出しの字（Dela Gothic One）だけ読む。本文は端末の字。待たずに画面を出す -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"></noscript>
<style>
/* 対戦アクションゲーム風。斜めに切ったパネル、プレイヤー色、太い斜体の数字。ゲーム画面としてあえて暗い一色（スマホの明暗設定によらない） */
:root{
  --bg:#0B0E1A;
  --bg2:#141A2E;
  --panel:#171F36;
  --line:#2A3556;
  --ink:#FFFFFF;
  --mute:#9AA6C4;
  --gold:#FFC93C;
  --p1:#F0453F; --p2:#3D7DF2; --p3:#DCE3F2; --p4:#35B866; --p5:#A66BFF; --p6:#FF8A3D; --p7:#29C4D8; --p8:#FF5FA2;
  --mnp:#FF7A45; --kotei:#3ED39A; --tan:#5BA4FF; --card:#FFC93C; --new:#B6F06A;
  /* 「‹ ポータル」ボタン（sieg-nav.js）をこの画面の色に合わせる */
  --sg-surface:#171F36; --sg-ink:#FFFFFF; --sg-hair:#2A3556; --sg-lift:none;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,#24305A 0%,transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.wrap{max-width:480px;margin:0 auto;padding-block:12px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.it{font-style:italic;display:inline-block;transform:skewX(-8deg)}

.note{font-size:11.5px;color:var(--mute);text-align:center}
.note b{color:var(--gold)}

/* 見出しの帯 */
.band{font-family:var(--disp);font-size:15px;letter-spacing:.06em;padding:6px 18px 6px 14px;align-self:flex-start;
  background:var(--ink);color:var(--bg);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}

/* タブ（選んでいるタブは白。金は報酬・達成だけに使う） */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tab{font-family:var(--disp);font-size:16px;padding:14px 0;color:var(--mute);background:var(--panel);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.tab[aria-selected="true"]{background:#fff;color:var(--bg)}
.tab:disabled{opacity:.5;cursor:default}

/* ファイター選択 */
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:4px}
.roster .slot{aspect-ratio:1/1}
.roster .slot[aria-pressed="true"]{box-shadow:inset 0 0 0 3px #fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.4))}
.roster-head{display:flex;justify-content:flex-end;margin-bottom:-8px}
.sortbtn{font-size:11.5px;font-weight:900;color:var(--mute);padding:4px 2px}
.sortbtn b{color:#fff}
.slot .one{position:absolute;right:4px;top:3px;font-family:var(--disp);font-size:11px;padding:0 6px;background:var(--gold);color:#1A1405;
  clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.slot{position:relative;aspect-ratio:3/4;max-width:100%;filter:brightness(.8) saturate(.85);background:linear-gradient(160deg,var(--c) 0%,#1B2236 100%);
  background:linear-gradient(160deg,var(--c) 0%,color-mix(in srgb,var(--c) 35%,var(--bg)) 100%);
  clip-path:polygon(0 0,100% 0,100% 88%,88% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;transition:opacity .15s,transform .15s}
.slot .fig{position:absolute;inset:16% 6% 20%;width:auto;height:auto}
.slot .tag{position:absolute;left:6px;top:4px;font-family:var(--disp);font-size:11px;color:var(--c-ink,#fff)}
.slot .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);font-family:var(--disp);font-size:12px;padding:3px 0 4px;text-align:center}
.slot[aria-pressed="true"]{filter:none;transform:translateY(-3px)}
.slot[aria-pressed="true"] .nm{background:#fff;color:var(--bg)}

/* ファイターパネル */
.fighter{position:relative;overflow:hidden;background:var(--panel);min-height:300px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
/* 選手色は左の斜めの帯だけ。文字を置く右側（.info は左から48%より右）には色がかからないので、
   黄色や水色の選手でも文字が読める */
.fighter .bgc{position:absolute;inset:0;background:#202940;background:color-mix(in srgb,var(--c) 22%,var(--bg))}
.fighter .bgc::before{content:"";position:absolute;inset:0;background:var(--c);clip-path:polygon(0 0,46% 0,34% 100%,0 100%)}
.fighter .lines{position:absolute;inset:0;width:100%;height:100%;opacity:.32}
.fighter .chara{position:absolute;left:0;bottom:0;width:50%;height:92%;display:flex;align-items:flex-end;justify-content:center;animation:idle 2.4s ease-in-out infinite}
.fig{display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;color:rgba(255,255,255,.22)}
.fig svg{width:72%;height:auto;max-height:100%}
.fig img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(5px 5px 0 rgba(0,0,0,.35))}
@keyframes idle{50%{transform:translateY(-4px)}}
.fighter .info{position:relative;margin-left:48%;padding:16px 14px 18px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:300px}
.fighter .pl{font-family:var(--disp);font-size:13px;color:var(--c-ink,#fff);background:var(--c);padding:2px 12px 2px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.fighter .name{font-family:var(--disp);font-size:38px;line-height:1;letter-spacing:.02em;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
.fighter .cls{font-size:12px;font-weight:900;color:var(--gold)}
.fighter .lvrow{display:flex;align-items:center;gap:10px}
.fighter .lv{font-family:var(--disp);font-size:16px}
.fighter .lv b{font-size:30px;margin-left:2px;font-weight:400}
.rank{font-family:var(--disp);font-size:20px;width:40px;height:40px;display:grid;place-items:center;color:#1A1405;background:var(--gold);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.rank.S{background:linear-gradient(135deg,#FFF0A8,#FFC93C 45%,#FF7A45 75%,#C69CFF);width:46px;height:46px;font-size:23px;
  filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 10px rgba(255,201,60,.65))}
.rank.A{background:linear-gradient(135deg,#FFE0A0,#FF8A3D)}
.rank.B{background:#D3DBEA} .rank.C{background:#C98A55}
.exp{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;transform:skewX(-14deg);width:100%}
.exp i{height:9px;background:rgba(255,255,255,.18)}
.exp i.on{background:#fff}
.fighter .nx{font-size:11.5px;font-weight:700;color:#E6ECFA}
.power{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.power .lbl{font-size:11px;font-weight:900;letter-spacing:.2em;color:#E6ECFA}
.power .num{font-family:var(--disp);font-size:clamp(38px,13vw,56px);line-height:1;color:var(--rankc,#fff);font-variant-numeric:tabular-nums;
  -webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:5px 5px 0 rgba(0,0,0,.62),8px 8px 0 rgba(0,0,0,.22)}
.power .num.d5{font-size:clamp(30px,10.5vw,46px);-webkit-text-stroke:2px #fff}
.power .num.hit{animation:hit .35s steps(3)}
/* ファイターの右上：順位と月末の見込み */
.fighter .hud-top{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;z-index:2}
.fighter .posb{font-family:var(--disp);font-size:12px;background:#fff;color:var(--bg);padding:2px 10px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.fighter .posb b{font-size:19px;margin-right:2px;font-weight:400}
.fighter .pace{font-size:10.5px;font-weight:900;color:#E6ECFA;background:rgba(0,0,0,.42);padding:3px 8px;white-space:nowrap}
.fighter .pace b{font-family:var(--disp);font-weight:400;font-size:12.5px;margin:0 2px}
.fighter .pace[hidden],.fighter .posb[hidden]{display:none}
.fighter .info{padding-top:46px}
/* 月末ペースが出ている時は2段になるので、P1の札をその下へ */
.fighter.has-pace .info{padding-top:76px}
@keyframes hit{30%{transform:scale(1.15) skewX(-8deg);color:var(--gold)}}
.power .diff{display:inline-block;font-family:var(--disp);font-size:12.5px;padding:2px 12px;background:#fff;color:#08704A;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.power .diff.down{color:#C33}

/* キャラを選ぶ */
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:520px){.picker{grid-template-columns:repeat(6,1fr)}}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;background:var(--panel);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);opacity:.7}
.pick .fig{height:52px}
.pick span{font-size:10.5px;font-weight:900;white-space:nowrap}
.pick[aria-pressed="true"]{opacity:1;background:var(--gold);color:#1A1405}


/* 次の目標 */
.goal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal[hidden]{display:none}
.gl{background:var(--panel);padding:12px 14px 13px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);display:flex;flex-direction:column;gap:6px;min-width:0}
.gl .t{font-size:11px;font-weight:900;color:var(--mute);letter-spacing:.06em}
.gl .v{font-family:var(--disp);font-size:24px;line-height:1.05}
.gl .v small{font-size:12px;margin-left:3px;color:var(--mute)}
.gl .v.top{color:var(--gold)}
.gl .s{font-size:11.5px;font-weight:700;color:#C9D2EA;line-height:1.5}
.gl .bar{height:7px;background:rgba(255,255,255,.12);transform:skewX(-14deg)}
.gl .bar i{display:block;height:100%;background:var(--gold)}
.stock{display:flex;flex-wrap:wrap;gap:4px;min-height:12px}
.stock i{width:10px;height:13px;display:block;background:#2A3556;transform:skewX(-14deg);
  clip-path:polygon(50% 0,100% 35%,100% 65%,50% 100%,0 65%,0 35%)}
.stock i.on{background:var(--gold);box-shadow:0 0 8px rgba(255,201,60,.7)}
.stock .more{font-family:var(--disp);font-size:11px;color:var(--mute);line-height:13px}

/* 今月の内訳（ポイントの積み上げ） */
.bd{background:var(--panel);padding:14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);display:flex;flex-direction:column;gap:12px}
.stack{display:flex;height:22px;gap:2px;transform:skewX(-14deg)}
.stack i{display:block;height:100%;background:var(--c);min-width:4px;transform-origin:0 50%;animation:fill .7s cubic-bezier(.3,.7,.3,1) backwards}
.stack.empty{background:rgba(255,255,255,.08)}
@keyframes fill{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;font-weight:700;color:#C9D2EA}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:5px;background:var(--c);transform:skewX(-14deg)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:6px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .dot{width:6px;height:22px;background:var(--c);transform:skewX(-14deg)}
.item .lb{font-weight:900;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .lb small{display:block;font-size:10.5px;color:var(--mute);font-weight:700}
.item .ct{font-family:var(--disp);font-size:13px;color:#C9D2EA;white-space:nowrap}
.item .pt{font-family:var(--disp);font-size:20px;min-width:4.2em;text-align:right;color:var(--c)}
.bd .empty-msg{font-size:13px;color:var(--mute);line-height:1.7;text-align:center;padding:10px 0}
.more-box summary{font-family:var(--disp);font-weight:400;font-size:14px}
.more-box .growth,.more-box .badges{margin-top:12px}
.more-box .growth{background:none;padding:0;clip-path:none}

/* 成長の記録 */
.growth{background:var(--panel);padding:14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.growth svg{display:block;width:100%;height:auto;overflow:visible}
.growth .grid{stroke:var(--line);stroke-width:1}
.growth .axis{fill:var(--mute);font-family:var(--body);font-size:10px;font-weight:700}
.growth .mon{fill:var(--mute);font-family:var(--disp);font-size:11px}
.growth .mon.now{fill:var(--gold)}
.growth .val{fill:var(--ink);font-family:var(--disp);font-size:11px}
.growth .best{fill:var(--gold);font-family:var(--disp);font-size:11px}
.growth .none{fill:var(--line);font-family:var(--disp);font-size:11px}
.growth .bar{fill:#4A5A86;transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.3,.7,.3,1) backwards}
.growth .bar.now{fill:var(--gold)}
@keyframes grow{from{transform:scaleY(0)}}
.gsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gsum div{background:var(--bg2);padding:8px 11px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.gsum small{display:block;font-size:11px;color:var(--mute);font-weight:700}
.gsum b{font-family:var(--disp);font-weight:400;font-size:17px}
.gsum b.up{color:var(--kotei)} .gsum b.dn{color:var(--mnp)}

/* 称号（斜めのチップ）。レア度で色を変える：並＝銀、希＝青紫、激レア＝金の光、伝説＝虹の光 */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-family:var(--disp);font-size:13px;padding:7px 16px;background:#D3DBEA;color:#141A2E;white-space:nowrap;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.badge[data-rar="rare"]{background:linear-gradient(100deg,#3D7DF2,#A66BFF);color:#fff}
.badge[data-rar="epic"]{background:linear-gradient(100deg,#FFC93C,#FF7A45 55%,#A66BFF);color:#1A1405;filter:drop-shadow(0 0 7px rgba(255,201,60,.55))}
.badge[data-rar="legend"]{background:linear-gradient(100deg,#FFF0A8,#FFC93C 25%,#FF7A45 50%,#FF5FA2 75%,#7FD6FF);color:#1A1405;
  filter:drop-shadow(0 0 9px rgba(255,201,60,.75));background-size:200% 100%;animation:shine 3.2s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.badge.off{background:transparent;color:#8A97B8;box-shadow:inset 0 0 0 1.5px #3A4770;filter:none;animation:none;clip-path:none;border-radius:2px}
.badge.off small{font-family:var(--body);font-weight:900;font-size:10.5px;margin-left:6px;opacity:.9}
/* ファイター画面の称号の帯（横に流す） */
.tstrip-wrap{display:flex;flex-direction:column;gap:8px}
.tstrip-head{display:flex;align-items:center;justify-content:space-between}
.tstrip-head .t{font-size:11px;font-weight:900;color:var(--mute);letter-spacing:.08em}
.tstrip-head .t b{font-family:var(--disp);font-weight:400;color:#fff;font-size:14px;margin-left:4px}
.tstrip-head button{font-size:12px;font-weight:900;color:#fff}
.tstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-right:-16px;padding-right:16px}
.tstrip::-webkit-scrollbar{display:none}
.tstrip .badge{flex:none}
/* 記録タブ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--panel);padding:10px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.stats small{display:block;font-size:11px;color:var(--mute);font-weight:900}
.stats b{font-family:var(--disp);font-weight:400;font-size:22px}
.stats b small{display:inline;font-size:11px;margin-left:3px}
.tgroup{background:var(--panel);padding:12px 14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.tgroup h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:13px;color:var(--mute)}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .badge{font-size:12px;padding:5px 13px}
.trow .cond{font-size:11.5px;color:#C9D2EA;font-weight:700;line-height:1.4}
.trow .who{font-size:10.5px;color:var(--mute);font-weight:700;white-space:nowrap;text-align:right}
.trow .tbar{grid-column:1 / -1;height:5px;background:rgba(255,255,255,.08);transform:skewX(-14deg)}
.trow .tbar i{display:block;height:100%;background:#7FD6FF}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophies .empty{font-size:12px;color:var(--mute)}
/* ランキング：自分が下のほうのときは、画面の下に自分の行を固定する */
.mebar{position:sticky;bottom:10px;z-index:5;background:#fff;color:var(--bg);display:flex;align-items:center;gap:10px;padding:9px 14px;
  font-weight:900;font-size:13px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.mebar[hidden]{display:none}
.mebar b{font-family:var(--disp);font-weight:400;font-size:18px}
.mebar .r{margin-left:auto;font-size:11.5px}
.share{font-family:var(--disp);font-size:14px;padding:12px 0;color:#fff;background:#26304D;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.share[hidden]{display:none}
.share-msg{min-height:0;margin-top:-8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skel-msg{font-family:var(--disp);font-size:13px;color:var(--mute);text-align:center;margin-top:-6px}

details{font-size:12.5px;color:var(--mute);background:var(--panel);padding:12px 14px}
details summary{cursor:pointer;font-weight:900;color:var(--ink);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";color:var(--gold)}
details[open] summary::before{content:"－ "}
.formula{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:10px}
.formula span:nth-of-type(even){text-align:right;color:var(--ink);font-family:var(--disp)}
details p{margin:10px 0 0;line-height:1.7}

.go{display:block;text-align:center;text-decoration:none;font-family:var(--disp);font-size:17px;padding:14px 0;background:var(--gold);color:#1A1405;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.go:active{transform:scale(.98)}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:-4px}
.title-row h1{margin:0;font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.04em;text-shadow:3px 3px 0 var(--p1)}
.title-row .month{font-family:var(--disp);font-size:14px;color:var(--gold)}
.col{display:flex;flex-direction:column;gap:16px}
.state{font-family:var(--disp);font-size:15px;color:var(--mute);text-align:center;padding:48px 0;line-height:1.7}
.state[hidden],#picker-box[hidden]{display:none}

.note.left{text-align:left;margin:0;min-height:1.2em}
.formula .fh{grid-column:auto;color:var(--gold);font-family:var(--disp);font-weight:400;margin-top:6px}

/* ランキング */
.champ{position:relative;overflow:hidden;background:linear-gradient(115deg,var(--c) 0 55%,#202940 55%);
  background:linear-gradient(115deg,var(--c) 0 55%,color-mix(in srgb,var(--c) 28%,var(--bg)) 55%);color:var(--c-ink,#fff);
  padding:16px 16px 14px;min-height:156px;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.champ .fig{position:absolute;right:2%;bottom:0;width:42%;height:100%;animation:idle 2.4s ease-in-out infinite}
.champ .w{font-family:var(--disp);font-size:13px;background:var(--bg);color:#fff;display:inline-block;padding:2px 12px 2px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.champ .n{font-family:var(--disp);font-size:40px;line-height:1.1;margin-top:8px;text-shadow:3px 3px 0 rgba(0,0,0,.25)}
.champ .p{font-family:var(--disp);font-size:22px;margin-top:2px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp{position:relative;background:var(--panel);padding:10px 10px 10px 12px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;
  border-left:6px solid var(--c);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.hp.me{background:#26304D;background:color-mix(in srgb,var(--c) 22%,var(--panel))}
.hp .fig{width:40px;height:48px}
.hp .pl{font-family:var(--disp);font-size:11px;color:var(--c)}
.hp .nm{font-family:var(--disp);font-size:15px;line-height:1.2;padding-right:2.6em;overflow-wrap:anywhere}
.hp .pw{font-family:var(--disp);font-size:24px;line-height:1.05;text-shadow:2px 2px 0 var(--c)}
.hp .pos{position:absolute;right:10px;top:6px;font-family:var(--disp);font-size:16px;color:var(--mute)}
.hp .pos.first{color:var(--gold)}
.hp .sub{font-size:10.5px;color:var(--mute);font-weight:700}
.hp{animation:pop .45s cubic-bezier(.2,.9,.2,1) backwards}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
.hp .gauge{grid-column:1 / -1;height:5px;background:rgba(255,255,255,.08);transform:skewX(-14deg)}
.hp .gauge i{display:block;height:100%;width:var(--w,0);background:var(--c);transform-origin:0 50%;animation:fill .7s cubic-bezier(.3,.7,.3,1) .3s backwards}
.hp.me{box-shadow:inset 0 0 0 2px var(--gold)}
.hp .you{font-family:var(--disp);font-size:10px;background:var(--gold);color:#1A1405;padding:0 5px;margin-left:6px;vertical-align:2px}
.rise{background:var(--panel);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.rise[hidden]{display:none}
.rise .t{font-size:11px;font-weight:900;color:var(--kotei);letter-spacing:.06em}
.rise .n{font-family:var(--disp);font-size:17px}
.rise .v{font-family:var(--disp);font-size:15px;color:var(--kotei);margin-left:auto}
.fxset{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink);font-weight:700;font-size:13px}
.fxset input{width:20px;height:20px;accent-color:var(--gold)}
.kings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kings .king:last-child:nth-child(odd){grid-column:1 / -1}
.king{background:var(--panel);padding:10px 14px 10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.king canvas{width:26px;height:26px}
.king .t{font-size:11px;color:var(--mute);font-weight:900}
.king .n{font-family:var(--disp);font-size:16px}
.king .n span{color:var(--c);font-size:13px;margin-left:4px}

/* 演出 */
.burst{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;padding:20px}
.burst .txt{font-family:var(--disp);font-size:min(16vw,76px);color:#fff;text-shadow:5px 5px 0 var(--gold),9px 9px 0 rgba(0,0,0,.45);
  animation:slam 1.6s cubic-bezier(.2,.9,.2,1) forwards;text-align:center;line-height:1.05}
.burst .txt small{display:block;font-size:.34em;margin-top:6px;text-shadow:3px 3px 0 var(--gold)}
@keyframes slam{0%{transform:skewX(-10deg) scale(2.4);opacity:0}12%{transform:skewX(-10deg) scale(1);opacity:1}80%{opacity:1;transform:skewX(-10deg) scale(1)}100%{transform:skewX(-10deg) scale(1.05) translateY(-10px);opacity:0}}
.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translate(4px,-3px)}50%{transform:translate(-4px,2px)}75%{transform:translate(3px,3px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:19;pointer-events:none}

.view[hidden],.burst[hidden]{display:none}

/* 読み込み中の骨組み（データが来るまで、何が出るかの形だけ見せる） */
.skel-wrap{display:flex;flex-direction:column;gap:16px}
.skel-wrap[hidden]{display:none}
.skel{background:var(--panel);position:relative;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.07) 50%,transparent 80%);
  animation:sweep 1.1s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.skel-row{display:flex;gap:6px}
.skel-row .skel{flex:0 0 66px;height:88px;clip-path:polygon(0 0,100% 0,100% 88%,88% 100%,0 100%)}
.stale{font-size:11.5px;color:var(--mute);text-align:right;margin-top:-8px}
.stale[hidden]{display:none}

/* パソコン・タブレット：2列にして、ランキングは4人ずつ並べる */
@media (min-width:760px){
  .wrap{max-width:960px}
  #view-status .col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #view-status .col > *{grid-column:1 / -1}
  #view-status .col > .fighter{grid-column:1;grid-row:3 / span 4}
  #view-status .col > .tstrip-wrap,#view-status .col > .goal,#view-status .col > .bd-band,#view-status .col > .bd{grid-column:2}
  .tstrip{margin-right:0;padding-right:0;flex-wrap:wrap}
  .roster{grid-template-columns:repeat(8,1fr)}
  .hud{grid-template-columns:repeat(4,1fr)}
  .kings{grid-template-columns:repeat(5,1fr)}
  .kings .king:last-child:nth-child(odd){grid-column:auto}
  #view-log .col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #view-log .col > .wide{grid-column:1 / -1}
}
/* ═══ 読みやすさ：小さすぎた文字（9〜10.5px）を大きく、弱い文字を少し明るく ═══ */
:root{--mute:#AEB9D6}
.fighter .pace{font-size:11.5px}
.fighter .nx{font-size:12.5px}
.power .lbl{font-size:12px}
.pick span{font-size:11.5px}
.item .lb small{font-size:11.5px}
.badge.off small{font-size:11.5px}
.gl .t{font-size:12px}
.gl .s{font-size:12.5px}
.trow .cond{font-size:12.5px}
.trow .who{font-size:11.5px}
.hp .sub{font-size:12px;color:#C9D2EA}
.hp .you{font-size:11px}

/* ═══ ランキング：まだ獲得のない人は、大きいカードにせず1行にまとめる ═══ */
.zeros{grid-column:1 / -1;background:var(--panel);padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.zeros .t{font-size:12px;font-weight:900;color:var(--mute);margin-right:4px}
.zeros .z{font-family:var(--disp);font-size:13px;padding:3px 10px;background:rgba(255,255,255,.07);border-left:3px solid var(--c)}
.zeros .z.me{background:var(--gold);color:#1A1405}

/* ═══ 記録：次に取れそうな称号＋区分ごとに折りたたみ ═══ */
.tnext{background:var(--panel);padding:12px 14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.tnext h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:13px;color:var(--gold)}
details.tgroup > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left;font-family:var(--disp);font-weight:400;font-size:13px;color:var(--mute);padding:2px 0}
details.tgroup > summary::-webkit-details-marker{display:none}
details.tgroup > summary b{font-weight:400;color:#fff;margin-left:8px}
details.tgroup > summary::before{content:none}
details.tgroup > summary::after{content:"＋";color:var(--gold)}
details.tgroup[open] > summary::after{content:"－"}
details.tgroup[open] > summary{margin-bottom:6px}

/* ═══ 前の月を見る（‹ 2026年10月 ›） ═══ */
.mnav{display:inline-flex;align-items:center;gap:6px}
.mnav button{width:30px;height:30px;border:0;background:rgba(255,255,255,.08);color:#fff;font-family:var(--disp);font-size:16px;line-height:1;cursor:pointer;
  clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.mnav button:disabled{opacity:.25;cursor:default}
.past-note{font-size:12px;font-weight:900;color:#1A1405;background:var(--gold);padding:4px 12px;align-self:flex-start;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.past-note[hidden]{display:none}

/* ═══ パソコン：成長のグラフが横いっぱいに広がって大きくなりすぎないように ═══ */
@media (min-width:900px){ #growth svg{display:block;width:100%;height:240px} }

/* ═══ スマホ：キャラ選びは横にスクロールする1段（自分のカードを上に） ═══ */
@media (max-width:560px){
  .roster{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
  .roster::-webkit-scrollbar{display:none}
  .roster .slot{flex:0 0 76px;aspect-ratio:3/4;scroll-snap-align:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  /* 読み込めなかったとき（ほかのツールと同じ形。このページは暗い配色なので色だけ別） */
  .sg-err { max-width: 420px; margin: 10px auto; padding: 14px 16px; border-radius: 12px; background: rgba(240,123,111,.12); border: 1px solid rgba(240,123,111,.35);
    color: #D5DDE8; font-size: 14px; line-height: 1.6; text-align: left; }
  .sg-err > b { display: block; color: #FF9A8F; font-weight: 900; font-size: 15px; margin-bottom: 2px; }
  .sg-err details { margin-top: 8px; font-size: 12px; color: #9AA6B5; }
  .sg-err button { display: block; margin-top: 12px; min-height: 42px; padding: 0 20px; border: 0; border-radius: 10px; background: #E9EEF4; color: #0C1015; font: 800 14px/1 inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div data-sieg-back></div>

  <div class="title-row">
    <h1 class="it">戦闘力</h1>
    <span class="mnav"><button type="button" id="m-prev" aria-label="前の月">‹</button><span class="month" id="month-label"></span><button type="button" id="m-next" aria-label="次の月">›</button></span>
  </div>

  <div class="tabs" role="tablist" aria-label="表示の切り替え">
    <button class="tab" id="tab-status" role="tab" aria-selected="true" aria-controls="view-status" disabled>ファイター</button>
    <button class="tab" id="tab-rank" role="tab" aria-selected="false" aria-controls="view-rank" tabindex="-1" disabled>ランキング</button>
    <button class="tab" id="tab-log" role="tab" aria-selected="false" aria-controls="view-log" tabindex="-1" disabled>記録</button>
  </div>
  <div class="stale" id="stale" hidden>前回の表示です・更新中…</div>
  <div class="past-note" id="past-note" hidden></div>

  <div class="skel-wrap" id="skel" aria-hidden="true">
    <div class="skel-row"><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i></div>
    <div class="skel" style="height:300px"></div>
    <div class="skel" style="height:110px"></div>
    <div class="skel-msg">読み込み中…</div>
  </div>
  <div class="sr" id="live" role="status" aria-live="polite"></div>
  <div class="state" id="state" hidden></div>

  <section class="view" id="view-status" role="tabpanel" aria-labelledby="tab-status" hidden>
    <div class="col">
      <div class="roster-head"><button type="button" class="sortbtn" id="sort"></button></div>
      <div class="roster" id="roster" aria-label="見る人を選ぶ"></div>

      <div class="fighter" id="fighter">
        <div class="bgc"></div>
        <canvas class="lines" id="lines" aria-hidden="true"></canvas>
        <div class="hud-top"><span class="posb" id="posb"></span><span class="pace" id="pace" hidden></span></div>
        <div class="chara" id="chara"></div>
        <div class="info">
          <span class="pl" id="pl"></span>
          <div class="name it" id="name"></div>
          <div class="cls" id="cls"></div>
          <div class="lvrow"><div class="lv it">LV<b id="lv"></b></div><div class="rank" id="rank"></div></div>
          <div class="exp" id="exp"></div>
          <div class="nx" id="nx"></div>
          <div class="power">
            <div class="lbl" id="power-lbl">今月の戦闘力</div>
            <div class="num it" id="power">0</div>
            <span class="diff" id="diff"></span>
          </div>
        </div>
      </div>

      <div class="tstrip-wrap">
        <div class="tstrip-head"><span class="t">称号<b id="tcount"></b></span><button type="button" id="to-log">すべて見る ›</button></div>
        <div class="tstrip" id="tstrip"></div>
      </div>

      <div class="goal" id="goal"></div>

      <span class="band bd-band" id="bd-band">今月の内訳</span>
      <div class="bd" id="bd"></div>

      <details class="more-box" id="picker-box">
        <summary>キャラを変える</summary>
        <div class="picker" id="picker" aria-label="キャラを選ぶ" style="margin-top:12px"></div>
        <p class="note left" id="picker-msg"></p>
      </details>

      <button type="button" class="share" id="share" hidden>今月の戦闘力をシェア</button>
      <p class="note share-msg" id="share-msg"></p>
      <a class="go" id="go-gain" href="gain.html">獲得報告を送る</a>
    </div>
  </section>

  <section class="view" id="view-rank" role="tabpanel" aria-labelledby="tab-rank" hidden>
    <div class="col">
      <div class="champ" id="champ"></div>
      <div class="rise" id="rise" hidden></div>
      <span class="band" id="rank-band">今月の順位</span>
      <div class="hud" id="hud"></div>
      <span class="band">部門賞</span>
      <div class="kings" id="kings"></div>
      <div class="note">順位は毎月1日にリセットされます（同点は同じ順位）。称号とレベルは消えません。</div>
      <div class="mebar" id="mebar" hidden></div>
    </div>
  </section>

  <section class="view" id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden>
    <div class="col">
      <span class="band wide" id="log-band">記録</span>
      <div class="stats wide" id="stats"></div>
      <div class="tgroup wide"><h3>月間チャンピオン</h3><div class="trophies" id="trophies"></div></div>
      <div id="titles" class="col wide"></div>
      <div class="growth wide"><div id="growth"></div><div class="gsum" id="gsum"></div></div>
      <details class="more-box wide">
        <summary>設定</summary>
        <label class="fxset"><input type="checkbox" id="fx-off"> 演出（大きな文字・紙吹雪）を出さない</label>
      </details>
      <details class="wide">
        <summary>戦闘力・レベル・称号のしくみ</summary>
        <p id="formula-note"></p>
        <div class="formula" id="formula"></div>
      </details>
    </div>
  </section>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="burst" id="burst" hidden><div class="txt" id="bursttxt"></div></div>

<script src="gas-client.js"></script>
<script src="sieg-nav.js"></script>
<script src="sieg-roster.js"></script>
<script src="sieg-products.js"></script>
<script>
(function(){
  'use strict';
  // 動きを減らす設定は、開いたあとに変えても追いかける
  var MQ = matchMedia('(prefers-reduced-motion: reduce)');
  function reduced(){ return MQ.matches; }
  var R = window.SiegRoster, PR = window.SiegProducts;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function fmt(n){ return Number(n).toLocaleString('ja-JP'); }
  function load(k){ try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
  function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  if (!R || !PR) { $('state').textContent = '読み込みに失敗しました。電波のよいところで再読み込みしてください。'; return; }

  /* ── キャラの枠（12体）──
     画像は fighters/ フォルダに 01.png 〜 12.png の名前で置く（背景が透明な PNG がきれい）。
     画面では軽い版（01.webp 〜。長い辺 640px）を使い、無い番号だけ PNG を読む（README に作り方）。
     名前を付けたいときは、下の NAMES を書き換える。画像が無い枠はシルエットと「？」を出す。 */
  var NAMES = ['キャラ1','キャラ2','キャラ3','キャラ4','キャラ5','キャラ6','キャラ7','キャラ8','キャラ9','キャラ10','キャラ11','キャラ12'];
  var FIGHTERS = NAMES.map(function(n, i){ var no = (i < 9 ? '0' : '') + (i + 1); return { id: no, name: n, img: 'fighters/' + no + '.webp', png: 'fighters/' + no + '.png' }; });
  function fighterOf(id){ for (var i = 0; i < FIGHTERS.length; i++) if (FIGHTERS[i].id === id) return FIGHTERS[i]; return FIGHTERS[0]; }
  var SIL = '<svg viewBox="0 0 100 120" aria-hidden="true"><g fill="currentColor">' +
    '<circle cx="50" cy="30" r="17"/><path d="M22 112c0-30 10-50 28-50s28 20 28 50z"/></g>' +
    '<text x="50" y="38" text-anchor="middle" font-size="22" font-family="Dela Gothic One, sans-serif" fill="var(--bg)">?</text></svg>';
  var imgOk = {};   // 一度読めなかった画像は、何度も取りに行かない
  function figEl(id){
    var f = fighterOf(id), box = document.createElement('span');
    box.className = 'fig'; box.innerHTML = SIL;
    if (imgOk[f.id] === false) return box;
    var img = new Image(); img.alt = f.name; img.decoding = 'async';
    img.onload = function(){ imgOk[f.id] = true; box.innerHTML = ''; box.appendChild(img); };
    // 軽い版（.webp）が無ければ PNG、それも無ければシルエットのまま
    img.onerror = function(){ if (img.src.indexOf('.webp') >= 0) { img.src = f.png; return; } imgOk[f.id] = false; };
    img.src = f.img;
    return box;
  }

  /* ── ドット絵の小さいアイコン（区分ごと）── */
  var PX = {
    'MNP':  { map:['......kk','.....kwk','....kwk.','.k.kwk..','..kwk...','..kgk...','.kgkk...','kk......'], pal:{k:'#1B1424',w:'#FFFFFF',g:'#FFC93C'} },
    '固定': { map:['.kkkkkk.','kggggggk','kgccccgk','kgcwwcgk','kgccccgk','.kgccgk.','..kggk..','...kk...'], pal:{k:'#1B1424',g:'#FFC93C',c:'#3ED39A',w:'#FFFFFF'} },
    '端末': { map:['.kkkkkk.','.kbbbbk.','.kbwwbk.','.kbbbbk.','.kbbbbk.','.kbbbbk.','.kkwwkk.','.kkkkkk.'], pal:{k:'#1B1424',b:'#5BA4FF',w:'#FFFFFF'} },
    'カード':{ map:['........','kkkkkkkk','kggggggk','kkkkkkkk','kggggggk','kgwwgggk','kggggggk','kkkkkkkk'], pal:{k:'#1B1424',g:'#FFC93C',w:'#FFFFFF'} },
    '新規': { map:['...kk...','...kk...','..kyyk..','kkkyykkk','.kyyyyk.','..kyyk..','.kyk.kyk','.kk...kk'], pal:{k:'#1B1424',y:'#B6F06A'} }
  };
  function drawPx(cv, cat){
    var d = PX[cat] || PX['新規'], h = d.map.length, w = d.map[0].length, c = cv.getContext('2d');
    cv.width = w; cv.height = h; c.clearRect(0, 0, w, h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) { var col = d.pal[d.map[y][x]]; if (col) { c.fillStyle = col; c.fillRect(x, y, 1, 1); } }
    return cv;
  }
  var CAT_COL = { 'MNP':'--mnp', '固定':'--kotei', '端末':'--tan', 'カード':'--card', '新規':'--new' };

  /* ── 数字の組み立て ── */
  // 選手色と、その色の上に置く文字の色（黄色・水色・橙は明るいので暗い文字）
  var COLS = [['--p1','#fff'], ['--p2','#fff'], ['--p3','#1A1405'], ['--p4','#fff'],
              ['--p5','#fff'], ['--p6','#1A1405'], ['--p7','#1A1405'], ['--p8','#fff']];
  function paint(el, p){ el.style.setProperty('--c', 'var(' + p.col + ')'); el.style.setProperty('--c-ink', p.ink); }
  var PEOPLE = R.forTool('power');
  var urlName = new URLSearchParams(location.search).get('staff') || '';
  var ME = PEOPLE.indexOf(urlName) >= 0 ? urlName : SiegNav.staff(PEOPLE);
  var P = [], MONTHS = [], CUR = '', cur = 0;
  // 見る月：ふだんは今月。‹ › で前の月へ（アドレスの &ym=2026-10 に残す）。NOWM は今月
  var NOWM = '', VIEW = (function(){ var q = new URLSearchParams(location.search).get('ym'); return /^\d{4}-\d{2}$/.test(q || '') ? q : ''; })();
  function isNowM(){ return CUR === NOWM; }
  function mw(){ return isNowM() ? '今月' : mlabel(CUR); }

  // to から数えて n か月（古い順）
  function lastMonths(to, n){
    var out = [], y = +to.slice(0, 4), m = +to.slice(5, 7);
    for (var i = 0; i < n; i++) { out.unshift(y + '-' + (m < 10 ? '0' : '') + m); m--; if (m < 1) { m = 12; y--; } }
    return out;
  }
  function prevMonth(k){ return lastMonths(k, 2)[0]; }
  var ALL_FROM = '2026-01';   // 獲得報告を始める前の月。ここから全部読んで、称号とレベル（消えないもの）を数える
  function build(data){
    NOWM = data.month;
    CUR = VIEW && VIEW < NOWM && VIEW >= ALL_FROM ? VIEW : NOWM;
    MONTHS = lastMonths(CUR, 6);
    var byPM = {}, monthsSeen = {};   // 名前 → 月 → [{carrier,label,count}]
    (data.rows || []).forEach(function(r){
      if (PEOPLE.indexOf(r[1]) < 0) return;
      var pm = byPM[r[1]] = byPM[r[1]] || {};
      (pm[r[0]] = pm[r[0]] || []).push({ carrier: r[2], label: r[3], count: Number(r[4]) || 0 });
      monthsSeen[r[0]] = true;
    });
    var fighters = data.fighters || {};
    P = PEOPLE.map(function(name, i){
      var months = byPM[name] || {};
      var now = PR.score(months[CUR]);
      var prevKey = prevMonth(CUR);
      var hist = MONTHS.map(function(m){ return months[m] ? PR.score(months[m]).power : null; });
      // これまで全部（消えない記録）：区分ごとの件数・合計・戦闘力の合計・いちばん高かった月
      var all = {}, allTotal = 0, allPw = 0, best = 0, mp = {};
      PR.CATS.forEach(function(c){ all[c] = 0; });
      Object.keys(months).forEach(function(m){
        var sc = PR.score(months[m]);
        PR.CATS.forEach(function(c){ all[c] += sc.cats[c] || 0; });
        allTotal += sc.total; allPw += sc.power; mp[m] = sc.power;
        if (sc.power > best) best = sc.power;
      });
      // 続けて報告した月の数（今月か先月から、さかのぼって途切れるまで）
      var streak = 0, k = mp[CUR] ? CUR : prevKey;
      while (mp[k] > 0) { streak++; k = prevMonth(k); }
      // 今月の商品ごとの件数と点数（点数の多い順）
      var items = {};
      (months[CUR] || []).forEach(function(x){
        var it = PR.find(x.carrier, x.label); if (!it || !x.count) return;
        var key = x.carrier + '\t' + x.label;
        items[key] = items[key] || { carrier:x.carrier, label:x.label, cat:it.cat, pt:it.pt, count:0 };
        items[key].count += x.count;
      });
      items = Object.keys(items).map(function(key){ return items[key]; })
        .sort(function(a, b){ return b.pt * b.count - a.pt * a.count || b.count - a.count; });
      var ch = fighters[name] && fighterOf(fighters[name]).id === fighters[name] ? fighters[name] : FIGHTERS[i % FIGHTERS.length].id;
      return { name:name, i:i, pl:'P' + (i + 1), col:COLS[i % COLS.length][0], ink:COLS[i % COLS.length][1], char:ch, pw:now.power, cats:now.cats, total:now.total,
        last: months[prevKey] ? PR.score(months[prevKey]).power : 0, hist:hist, items:items,
        all:all, allTotal:allTotal, allPw:allPw + 0, best:best, streak:streak, mp:mp, champs:[] };
    });
    // 月間チャンピオン（終わった月の1位。同点はみんな）
    Object.keys(monthsSeen).filter(function(m){ return m < CUR; }).sort().forEach(function(m){
      var top = Math.max.apply(null, P.map(function(p){ return p.mp[m] || 0; }));
      if (top > 0) P.forEach(function(p){ if ((p.mp[m] || 0) === top) p.champs.push(m); });
    });
    P.forEach(function(p){ p.titles = titlesOf(p); });
    // その称号を持っている人の数（レア度の実感）
    HAVE = {};
    P.forEach(function(p){ p.titles.forEach(function(t){ if (t.have) HAVE[t.id] = (HAVE[t.id] || 0) + 1; }); });
    cur = Math.max(0, PEOPLE.indexOf(ME));
  }

  /* ── 称号（消えない記録）──
     区分ごとの累計件数・続けて報告した月・いちばん高かった月の戦闘力で決まる。
     rar：common 並・rare 希・epic 激レア・legend 伝説。増やすときはここに足す */
  var HAVE = {};
  var TITLES = [
    { g:'MNP', id:'mnp1',  name:'MNP初陣',      rar:'common', cat:'MNP', n:1 },
    { g:'MNP', id:'mnp10', name:'MNPの狩人',    rar:'rare',   cat:'MNP', n:10 },
    { g:'MNP', id:'mnp30', name:'MNPの鬼',      rar:'epic',   cat:'MNP', n:30 },
    { g:'MNP', id:'mnp60', name:'MNP無双',      rar:'legend', cat:'MNP', n:60 },
    { g:'固定', id:'kt1',  name:'光の入口',     rar:'common', cat:'固定', n:1 },
    { g:'固定', id:'kt10', name:'回線職人',     rar:'rare',   cat:'固定', n:10 },
    { g:'固定', id:'kt30', name:'回線の支配者', rar:'epic',   cat:'固定', n:30 },
    { g:'端末・カード・新規', id:'tan1',  name:'端末デビュー',   rar:'common', cat:'端末', n:1 },
    { g:'端末・カード・新規', id:'tan15', name:'端末コレクター', rar:'rare',   cat:'端末', n:15 },
    { g:'端末・カード・新規', id:'cd1',   name:'カードデビュー', rar:'common', cat:'カード', n:1 },
    { g:'端末・カード・新規', id:'cd10',  name:'プラチナの民',   rar:'rare',   cat:'カード', n:10 },
    { g:'端末・カード・新規', id:'nw1',   name:'新規デビュー',   rar:'common', cat:'新規', n:1 },
    { g:'端末・カード・新規', id:'nw10',  name:'開拓者',         rar:'rare',   cat:'新規', n:10 },
    { g:'つみあげ', id:'all5',   name:'五刀流',         rar:'epic',   five:true },
    { g:'つみあげ', id:'tot100', name:'百戦錬磨',       rar:'epic',   total:100 },
    { g:'つみあげ', id:'st3',    name:'3か月連続出場',  rar:'rare',   streak:3 },
    { g:'つみあげ', id:'st6',    name:'半年皆勤',       rar:'epic',   streak:6 },
    { g:'つみあげ', id:'pw2000', name:'戦闘力 2,000',   rar:'rare',   best:2000 },
    { g:'つみあげ', id:'pw5000', name:'戦闘力 5,000',   rar:'legend', best:5000 }
  ];
  var RAR = { common:'並', rare:'希', epic:'激レア', legend:'伝説' }, RAR_ORDER = { legend:4, epic:3, rare:2, common:1 };
  function titlesOf(p){
    var list = TITLES.map(function(t){
      var cur = 0, need = 1, unit = '件', cond = '';
      if (t.cat) { cur = p.all[t.cat] || 0; need = t.n; cond = t.cat + ' 累計' + t.n + '件'; }
      else if (t.five) { cur = PR.CATS.filter(function(c){ return p.all[c] > 0; }).length; need = PR.CATS.length; unit = '区分'; cond = PR.CATS.join('・') + 'をどれも1件以上'; }
      else if (t.total) { cur = p.allTotal; need = t.total; cond = '全部で累計' + t.total + '件'; }
      else if (t.streak) { cur = p.streak; need = t.streak; unit = 'か月'; cond = t.streak + 'か月続けて報告（途切れると数え直し）'; }
      else if (t.best) { cur = p.best; need = t.best; unit = 'pt'; cond = '1か月の戦闘力が' + fmt(t.best) + 'をこえる'; }
      var have = cur >= need;
      return { id:t.id, g:t.g, name:t.name, rar:t.rar, have:have, cur:cur, need:need, cond:cond,
        left: have ? '' : 'あと' + fmt(need - cur) + unit, pct: have ? 100 : Math.min(99, Math.round(cur / need * 100)) };
    });
    p.champs.forEach(function(m){
      list.push({ id:'champ' + m, g:'月間チャンピオン', name:'月間チャンピオン ' + Number(m.slice(0, 4)) + '年' + Number(m.slice(5)) + '月', rar:'legend', have:true, champ:true });
    });
    return list;
  }
  function badgeHtml(t, small){
    return '<span class="badge' + (t.have ? '' : ' off') + '" data-rar="' + t.rar + '" title="' + esc(RAR[t.rar] + '・' + (t.cond || t.name)) + '">'
      + (t.have ? '★ ' : '') + esc(t.name) + (!t.have && !small ? '<small>' + esc(t.left) + '</small>' : '') + '</span>';
  }

  // ランクの境目とレベルの刻み（ここだけ直せば、ランク表示・次の目標・計算のしかたがそろって変わる）
  var RANKS = PR.RANKS || [['B', 1000], ['A', 1500], ['S', 2000]];   // 境目は sieg-products.js でそろえる
  var LV_STEP = 1000;   // これまでの戦闘力の合計がこれだけ増えるごとにレベルが1上がる（月が変わっても下がらない）
  function rankOf(v){ var r = 'C'; RANKS.forEach(function(x){ if (v >= x[1]) r = x[0]; }); return r; }
  var RANK_COLOR = { S:'#F0453F', A:'#FF8A3D', B:'#FFC93C', C:'#FFFFFF' };   // 戦闘力の数字の色
  function lvAt(allPw){ return Math.floor(allPw / LV_STEP) + 1; }
  function lvOf(p){ return lvAt(p.allPw); }
  function cls(p){
    if (p.total < 5) return 'かけだしファイター';
    var top = PR.CATS.slice().sort(function(a, b){ return p.cats[b] - p.cats[a]; })[0];
    if (p.cats[top] * 2 < p.total) return 'オールラウンダー';
    return { 'MNP':'MNPハンター', '固定':'固定マスター', '端末':'端末マスター', 'カード':'カード使い', '新規':'新規ハンター' }[top];
  }
  function mlabel(k){ return Number(k.slice(5, 7)) + '月'; }

  /* 大きい数字（今月の戦闘力）を、ファイターの枠に収まる大きさにする。
     「Dela Gothic One」は幅が広く、スマホでは 1,270 のような4桁でも右が切れていた。
     いちばん長くなる最後の数（to）で幅を測り、はみ出す分だけ文字を小さくする（数え上げの途中も同じ大きさ） */
  function fitPower(to){
    var el = $('power'), info = el.closest('.info');
    if (!el || !info || !info.clientWidth) return;
    var keep = el.textContent;
    if (to != null) el.textContent = fmt(to);
    el.style.fontSize = '';
    var cs = getComputedStyle(info);
    var avail = info.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var extra = 10 + (parseFloat(getComputedStyle(el).webkitTextStrokeWidth) || 0);   // 縁取りと影の分
    var need = el.getBoundingClientRect().width + extra;
    if (need > avail) {
      var fs = parseFloat(getComputedStyle(el).fontSize) * (avail - extra) / (need - extra);
      el.style.fontSize = Math.max(20, Math.floor(fs)) + 'px';
    }
    if (to != null) el.textContent = keep;
  }
  window.fitPower = function(){ fitPower(); };   // 確認用（テストから呼ぶ）

  function countUp(el, to){
    if (reduced()) { el.textContent = fmt(to); return; }
    var t0 = performance.now(), d = 900;
    (function step(t){ var k = Math.min(1, (t - t0) / d); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - k, 3))));
      if (k < 1) requestAnimationFrame(step); else { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); } })(t0);
  }

  /* 集中線（ファイターパネルの背景） */
  function drawLines(){
    var cv = $('lines'), r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    if (!r.width) return;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var cx = r.width * .24, cy = r.height * .62, seed = 3;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    c.fillStyle = 'rgba(255,255,255,.55)';
    for (var i = 0; i < 54; i++) {
      var a = rnd() * Math.PI * 2, w = .01 + rnd() * .025, R2 = Math.max(r.width, r.height) * 1.2, r0 = 70 + rnd() * 60;
      c.beginPath(); c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      c.lineTo(cx + Math.cos(a - w) * R2, cy + Math.sin(a - w) * R2); c.lineTo(cx + Math.cos(a + w) * R2, cy + Math.sin(a + w) * R2); c.closePath(); c.fill();
    }
  }

  // 並び：名簿順か、今月の順位順か（この端末に覚えておく）
  var SORT_KEY = 'siegPowerSort', byRank = load(SORT_KEY) === 'rank';
  function rosterOrder(){
    var idx = P.map(function(p, i){ return i; });
    return byRank ? idx.sort(function(a, b){ return P[b].pw - P[a].pw || a - b; }) : idx;
  }
  function renderRoster(){
    var box = $('roster'); box.innerHTML = '';
    $('sort').innerHTML = '並び：' + (byRank ? '名簿順 ⇄ <b>順位順</b>' : '<b>名簿順</b> ⇄ 順位順');
    rosterOrder().forEach(function(i){
      var p = P[i];
      var b = document.createElement('button'); b.type = 'button'; b.className = 'slot';
      paint(b, p); b.setAttribute('aria-pressed', String(i === cur)); b.setAttribute('aria-label', p.name + (p.name === ME ? '（あなた）' : ''));
      b.innerHTML = '<span class="tag">' + p.pl + '</span>' + (p.name === ME ? '<span class="one">YOU</span>' : '');
      b.appendChild(figEl(p.char));
      b.insertAdjacentHTML('beforeend', '<span class="nm">' + esc(p.name) + '</span>');
      b.onclick = function(){ cur = i; renderRoster(); renderFighter(); };
      box.appendChild(b);
    });
  }
  $('sort').onclick = function(){ byRank = !byRank; store(SORT_KEY, byRank ? 'rank' : 'list'); renderRoster(); };

  // 順位（同点は同じ順位）
  function posOf(p){ var n = 1; P.forEach(function(x){ if (x.pw > p.pw) n++; }); return n; }
  // 月末の見込み（今のペースが続いたら）
  function paceOf(p){
    var d = new Date(), ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    if (ym !== CUR || !p.pw) return 0;
    var day = d.getDate(), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return day >= last || day < 3 ? 0 : Math.round(p.pw / day * last);
  }
  function renderFighter(){
    var p = P[cur], f = $('fighter');
    paint(f, p);
    var ch = $('chara'); ch.innerHTML = ''; ch.appendChild(figEl(p.char));
    $('pl').textContent = p.pl + (p.name === ME ? '　あなた' : '');
    $('name').textContent = p.name; $('cls').textContent = cls(p); $('lv').textContent = lvOf(p);
    var rk = $('rank'); rk.textContent = rankOf(p.pw); rk.className = 'rank ' + rankOf(p.pw);
    var num = $('power');
    num.style.setProperty('--rankc', RANK_COLOR[rankOf(p.pw)] || '#fff');
    num.classList.toggle('d5', p.pw >= 10000);
    fitPower(p.pw);
    // 右上：順位と月末の見込み
    var pos = posOf(p), pb = $('posb');
    pb.hidden = !p.pw; pb.innerHTML = '<b>' + pos + '</b>位 / ' + P.length;
    var pace = paceOf(p), pc = $('pace');
    pc.hidden = !pace; $('fighter').classList.toggle('has-pace', !!pace); pc.innerHTML = '月末 <b>' + fmt(pace) + '</b>pt ペース（' + rankOf(pace) + '）';
    // レベル（これまでの戦闘力の合計で上がる。ちょうど上がったところは満タンで見せる）
    var rem = p.allPw % LV_STEP, e = '', on = rem === 0 && p.allPw > 0 ? 12 : Math.round(rem / LV_STEP * 12);

    countUp(num, p.pw);
    var d = p.pw - p.last, de = $('diff'); de.textContent = (d >= 0 ? '▲ +' : '▼ ') + fmt(d) + '（先月比）'; de.className = 'diff' + (d < 0 ? ' down' : '');

    renderGoal(p);
    renderBreakdown(p);
    renderStrip(p);
    $('share').hidden = p.name !== ME || !p.pw || !isNowM();
    $('goal').hidden = !isNowM();   // 次の目標は今月だけ
    $('live').textContent = p.name + 'さん。' + mw() + 'の戦闘力 ' + fmt(p.pw) + (p.pw ? '、' + pos + '位' : '') + '。レベル ' + lvOf(p) + '。';
  }

  // 称号の帯：持っている称号をレア度の高い順に。まだ1つもなければ、いちばん近い称号を
  function renderStrip(p){
    var got = p.titles.filter(function(t){ return t.have; })
      .sort(function(a, b){ return RAR_ORDER[b.rar] - RAR_ORDER[a.rar]; });
    var all = p.titles.filter(function(t){ return !t.champ; }).length + p.champs.length;
    $('tcount').textContent = got.length + ' / ' + all;
    var next = p.titles.filter(function(t){ return !t.have; }).sort(function(a, b){ return b.pct - a.pct; }).slice(0, got.length ? 1 : 2);
    $('tstrip').innerHTML = got.map(function(t){ return badgeHtml(t, true); }).join('') + next.map(function(t){ return badgeHtml(t); }).join('');
  }
  $('to-log').onclick = function(){ tab('log'); scrollTo(0, 0); };

  /* 次の目標：次のランクまで／ひとつ上の順位まで。足りない点数を「MNP なら何件・固定なら何件」に直して出す */
  // その人のキャリア（名簿の carrier。無ければ今月いちばん多く報告したキャリア）の、MNP と固定のいちばん高い点数で数える
  function mainCarrier(p){
    var c = R.carrier ? R.carrier(p.name) : '';
    if (c) return c;
    var n = {}; p.items.forEach(function(it){ n[it.carrier] = (n[it.carrier] || 0) + it.count; });
    return Object.keys(n).sort(function(a, b){ return n[b] - n[a]; })[0] || 'Softbank';
  }
  // その区分でいちばん点数の高い商品（同じ点数なら商品表で先のもの）
  function topItem(carrier, cat){
    return PR.items(carrier).filter(function(it){ return it.cat === cat; })
      .reduce(function(m, it){ return !m || it.pt > m.pt ? it : m; }, null);
  }
  // 「SMNP 5件（または 光新規 10件）」
  function inCounts(p, gap){
    var c = mainCarrier(p), a = topItem(c, 'MNP'), b = topItem(c, '固定');
    if (!a || !b) return '';
    return esc(a.label) + ' ' + Math.ceil(gap / a.pt) + '件（または ' + esc(b.label) + ' ' + Math.ceil(gap / b.pt) + '件）';
  }
  // 残り（ストック）：次のランクまでを「その人のキャリアの MNP 何件分」で並べ、取った分を光らせる
  function stockHtml(p, span, gap){
    var it = topItem(mainCarrier(p), 'MNP');
    if (!it) return '';
    var total = Math.ceil(span / it.pt), left = Math.ceil(gap / it.pt), got = Math.max(0, total - left), show = Math.min(total, 12), h = '';
    for (var i = 0; i < show; i++) h += '<i' + (i < Math.min(got, show) ? ' class="on"' : '') + '></i>';
    if (total > show) h += '<span class="more">…' + total + '</span>';
    return '<div class="stock" title="' + esc(it.label) + ' 1件 ＝ ◆1つ">' + h + '</div>';
  }
  function renderGoal(p){
    var next = null; for (var i = 0; i < RANKS.length; i++) if (p.pw < RANKS[i][1]) { next = RANKS[i]; break; }
    var prevTh = 0; RANKS.forEach(function(r){ if (p.pw >= r[1]) prevTh = r[1]; });
    var a = next
      ? '<div class="t">' + next[0] + 'ランクまで</div><div class="v it">あと' + fmt(next[1] - p.pw) + '<small>pt</small></div>'
        + '<div class="bar"><i style="width:' + Math.round((p.pw - prevTh) / (next[1] - prevTh) * 100) + '%"></i></div>'
        + stockHtml(p, next[1] - prevTh, next[1] - p.pw)
        + '<div class="s">' + inCounts(p, next[1] - p.pw) + '</div>'

  /* 成長の記録：直近6か月（今月は今の値）。目盛りは同じ尺度で引く */
  function niceMax(v){ var s = [500,1000,1500,2000,2500,3000,4000,5000,6000,8000,10000]; for (var i = 0; i < s.length; i++) if (v <= s[i]) return s[i]; return Math.ceil(v / 1000) * 1000; }

    var W = 320, H = 176, L = 36, Rr = 8, T = 20, B = 24, ch = H - T - B, cw = W - L - Rr, slot = cw / vals.length, bw = Math.min(28, slot * .52);

      var isBest = v === best && v > 0 && !shown; if (isBest) shown = true;

    }
  }

  // シェア（LINE などへ。使えない端末では文をコピー）
  $('share').onclick = function(){
    var p = P[cur], pos = posOf(p);
    var text = p.name + 'さん 今月の戦闘力 ' + fmt(p.pw) + 'pt（' + pos + '位 / ' + P.length + '人）LV' + lvOf(p);
    var url = location.origin + location.pathname;
    if (navigator.share) { navigator.share({ title: '今月の戦闘力', text: text, url: url }).catch(function(){}); return; }
    var msg = $('share-msg');
    (navigator.clipboard ? navigator.clipboard.writeText(text + ' ' + url) : Promise.reject())
      .then(function(){ msg.textContent = 'コピーしました。LINE などに貼り付けてください。'; })
      .catch(function(){ msg.textContent = text; });
  };

  if (ME) $('go-gain').href = 'gain.html?staff=' + encodeURIComponent(ME);

  // 前回のデータがあれば先にそれで出し、裏で取り直す（電波の弱い現場でも、開いてすぐ見える）
  var CACHE_KEY = 'siegPowerCache';
  var LAST = null;
  // さかのぼれる一番古い月：報告がある一番古い月（無ければ ALL_FROM）
  function FIRSTM(data){
    var first = '';
    (data.rows || []).forEach(function(r){ if (PEOPLE.indexOf(r[1]) >= 0 && (!first || r[0] < first)) first = r[0]; });
    return first && first > ALL_FROM ? first : ALL_FROM;
  }
  function goMonth(d){
    if (!LAST) return;
    var m = lastMonths(CUR, 2)[0];
    if (d > 0) { var y = +CUR.slice(0, 4), mo = +CUR.slice(5, 7) + 1; if (mo > 12) { mo = 1; y++; } m = y + '-' + (mo < 10 ? '0' : '') + mo; }
    if (m > LAST.month || m < FIRSTM(LAST)) return;
    VIEW = m === LAST.month ? '' : m;
    try { var u = new URL(location.href); if (VIEW) u.searchParams.set('ym', VIEW); else u.searchParams.delete('ym'); history.replaceState(null, '', u); } catch (e) {}
    show(LAST);
  }
  $('m-prev').onclick = function(){ goMonth(-1); };
  $('m-next').onclick = function(){ goMonth(1); };
  function show(data){
    var keep = P.length ? P[cur].name : '';   // 取り直したときは、見ていた人のまま
    build(data);
    if (keep && PEOPLE.indexOf(keep) >= 0) cur = PEOPLE.indexOf(keep);
    $('month-label').textContent = Number(CUR.slice(0, 4)) + '年' + mlabel(CUR);
    LAST = data;
    $('m-prev').disabled = CUR <= FIRSTM(data);
    $('m-next').disabled = isNowM();
    $('power-lbl').textContent = mw() + 'の戦闘力';
    $('bd-band').textContent = mw() + 'の内訳';
    $('rank-band').textContent = mw() + 'の順位';
    $('past-note').hidden = isNowM();
    $('past-note').textContent = Number(CUR.slice(0, 4)) + '年' + mlabel(CUR) + 'のふり返り（今月は ›）';
    $('skel').hidden = true; $('state').hidden = true;
    TABS.forEach(function(n){ $('tab-' + n).disabled = false; });
    renderRoster();
    tab(curTab);
  }
  var cached = load(CACHE_KEY);
  if (cached && cached.data && cached.data.rows) { show(cached.data); $('stale').hidden = false; }
  GasClient.get(PR.API, { action: 'gainStats', from: ALL_FROM }).then(function(data){
    if (!data || !data.ok || !data.rows) throw new Error('準備中です。もうしばらくお待ちください');
    store(CACHE_KEY, { at: Date.now(), data: data });
    $('stale').hidden = true;
    show(data);
    if (isNowM()) celebrate();   // 演出は今月を見ているときだけ
  }).catch(function(err){
    if (P.length) { $('stale').textContent = '前回の表示です（更新できませんでした：' + err.message + '）'; return; }
    $('skel').hidden = true;
    $('state').hidden = false;
    $('state').innerHTML = GasClient.errorHtml(err, '読み込めませんでした', 'もう一度読み込む');
    $('state').querySelector('[data-sg-retry]').onclick = function(){ location.reload(); };
  });
})();
</script>
</body>
</html>
